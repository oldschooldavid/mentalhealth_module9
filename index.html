<script>

function lsGet(k, d) { try { var v = localStorage.getItem(PH_NS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }

function slug(s) { return String(s).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, ''); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function strip(h) { return String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim(); }
function ul(a) { return '<ul>' + a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
function ol(a) { return '<ol>' + a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>'; }
function P(t) { return '<p>' + t + '</p>'; }

function DG(t) { return AL('red', '🔴 <b>Safety:</b> ' + t); }
function IN(t) { return AL('blue', '🔵 ' + t); }
function MN(t) { return '<div class="mn"><span class="lbl">Mnemonic</span>' + t + '</div>'; }
function PN(t) { return '<div class="pn">📋 <b>Prof. Note:</b> ' + t + '</div>'; }
function LX(t) { return '<span class="lx">LECTURE</span>' + t; }
function CR(t) { return '<span class="crit">' + t + '</span>'; }
function RG(t) { return '<span class="rng">' + t + '</span>'; }
function TB(h, rows) { return '<div class="tw"><table><tr>' + h.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>' + rows.map(function (r) { return '<tr>' + r.map(function (x) { return '<td>' + x + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>'; }
function C(id, t, o, body) { return { id: id, t: t, hy: !!(o && o.hy), kw: (o && o.kw) || '', body: Array.isArray(body) ? body.join('') : body }; }
var TABS = [
  { id: 'eating', name: '🍽 Eating Disorders', kind: 'topic', label: 'Eating Disorders' },
  { id: 'substance', name: '🧪 Substance Use', kind: 'topic', label: 'Substance Use Disorders' },

  { id: 'quiz', name: '🧠 Quiz Me', kind: 'tpl' },

];

var CARDS = { eating: [], substance: [], kids: [] };
var QUICK = { eating: [], substance: [], kids: [] };
var MAPS = {};
var BR_LABELS = ['Pathophysiology', 'Signs & Symptoms', 'Diagnostics', 'Nursing Interventions', 'Medications', 'Complications', 'Patient Education'];
function DM(id, name, tab, p, s, d, n, m, c, e) {
  var br = [], arr = [p, s, d, n, m, c, e];
  arr.forEach(function (a, i) { if (a && a.length) br.push([BR_LABELS[i], a]); });
  MAPS[id] = { name: name, tab: tab, kind: 'disease', br: br };
}
function PM(id, name, tab, br) { MAPS[id] = { name: name, tab: tab, kind: 'process', br: br }; }
/* ===== TOPIC: EATING DISORDERS (Ch 13) ===== */
QUICK.eating = [
 'BINGE = large amount of food in a discrete period (e.g., within any 2 hours) + sense of LOSS OF CONTROL',
 'BN and BED DSM-5-TR: binge eating on average at least ONCE A WEEK for THREE MONTHS',
 'Refeeding syndrome: negligible intake > 5 days → HYPOPHOSPHATEMIA is the hallmark',
 'Hospitalize: weight < 75% healthy body weight, arrhythmia, hypotension, temp < 98°F, extreme electrolytes, suicide risk',
 'AN goal weight 90% ideal body weight; weigh 2–3×/week (daily in underwear for week 1, no oral intake before weigh-in)',
 'Observe during meals AND at least 1 hour after eating to prevent purging'];
CARDS.eating.push(
C('ed_overview','Eating Disorders — Overview & Learning Objectives',{hy:1},[
 P('<b>Eating disorders (EDs)</b> are severe mental health conditions with significant disturbances in eating behaviors and related thoughts and emotions; they affect physical, psychological and social functioning.'),
 ul(['Distorted perception of weight/body image → unhealthy relationship with food (extreme restriction, compulsive exercise, binge eating, purging).','Can affect <b>any</b> gender, age, race/ethnicity, body weight or socioeconomic status.','Common EDs: <b>anorexia nervosa, bulimia nervosa, binge-eating disorder</b>; a person may have more than one type.','Without identification/treatment the physiological consequences can be life-threatening.','How nurses talk about EDs matters — language shapes the conversation.']),
 H4('Learning objectives'),ul(['Identify assessment cues; identify nursing priorities; plan outcomes','Differentiate safety/protective interventions; apply evidence-based practice','Analyze treatments; apply the nursing process to clients at risk for suicide'])]),
C('ed_an_def','Anorexia Nervosa (AN) — Definition & Subtypes',{hy:1,kw:'anorexia restricting purging subtype'},[
 P('People <b>avoid food, severely restrict food, or eat very small quantities of only certain foods</b>. <b>Intense fear of gaining weight/becoming fat</b> even when significantly underweight; <b>distorted body image</b> (see themselves as overweight).'),
 H4('Two subtypes'),ul([MK('<b>Restricting type</b>: severely limit amount/type of food; may exercise excessively. No recurrent binge/purge in last 3 months.'),MK('<b>Binge-eating/Purging type</b>: episodes of binge eating and/or purging (last 3 months).'),'<b>Binge</b> = large amount of food in a short period with loss of control. <b>Purging</b> = self-induced vomiting or misuse of laxatives, diuretics or enemas.'])]),
C('ed_an_mort','AN — Mortality & Demographics',{hy:1,kw:'anorexia mortality males'},[
 ul([MK('AN can be <b>fatal</b> from complications of starvation; extremely high mortality vs. other mental disorders.'),MK('Ages <b>15–24</b> with AN have <b>10×</b> the risk of dying vs. same-aged peers.'),MK('<b>Males = 25%</b> of AN; higher risk of dying because they are diagnosed <b>later</b> than females.'),'Individuals with AN often do <b>not</b> view behavior as a problem; usually seen due to concerned family/friends.'])]),
C('ed_an_ss','AN — Core Signs & Symptoms',{hy:1,kw:'anorexia signs symptoms lanugo'},[
 ul(['Severely restricted eating','Extreme thinness (<b>emaciation</b>)','Relentless pursuit of thinness; unwilling to maintain healthy weight','Intense fear of gaining weight','Distorted body image; self-esteem heavily influenced by weight/shape','<b>Denial</b> of seriousness of low body weight']),
 MN('<b>L-E-A-N</b> — <b>L</b>anugo · <b>E</b>maciation · <b>A</b>menorrhea/cold intolerance · <b>N</b>o insight (denial). (study aid)')]),
C('ed_an_late1','AN — Later Signs: Bones, Blood, Muscle, Skin',{kw:'anorexia osteopenia anemia'},[
 ul(['Thinning of bones (osteopenia/osteoporosis)','Anemia','Muscle wasting and weakness','Brittle hair and nails','Dry, yellowish skin','<b>Lanugo</b> — fine hair all over the body'])]),
C('ed_an_late2','AN — Later Signs: Cardiac, GI, Neuro, Systemic',{hy:1,kw:'anorexia bradycardia hypotension multiorgan'},[
 ul(['Severe constipation','Low blood pressure; slowed breathing and pulse','Drop in internal body temperature → feels cold all the time','Lethargy, sluggishness, fatigue; infertility','Damage to structure/function of the <b>heart</b>; brain damage; <b>multiorgan failure</b>'])]),
C('ed_an_dsm','DSM-5-TR Criteria — Anorexia Nervosa',{hy:1,kw:'anorexia dsm criteria'},[
 ol(['<b>Restriction of energy intake</b> relative to requirements → significantly low body weight for age, sex, developmental trajectory, physical health (less than minimally normal; in children/adolescents less than minimally expected).','<b>Intense fear</b> of gaining weight/becoming fat, or persistent behavior that interferes with weight gain even at significantly low weight.','<b>Disturbance in body image/self-evaluation</b>: undue influence of weight/shape on self-evaluation, or persistent lack of recognition of seriousness of low weight.']),
 P('<b>Specify:</b> Restricting type (weight loss by dieting, fasting, excessive exercise; no recurrent binge/purge in last <b>3 months</b>) · Binge-eating/purging type (recurrent binge/purge in last <b>3 months</b>).')]),
C('ed_bn','Bulimia Nervosa (BN) — Definition',{hy:1,kw:'bulimia binge purge weight'},[
 ul(['<b>Recurrent, frequent</b> episodes of binge eating (unusually large amount in short time + lack of control) followed by <b>compensatory behaviors</b>: forced vomiting, excessive laxatives/diuretics, fasting, excessive exercise, or a combination.',MK('BN clients may be slightly underweight, <b>normal weight</b>, or overweight → <b>harder to detect</b> than AN.'),'Combination AN–BN → significantly low body weight; BN alone → typically normal or above-normal weight.'])]),
C('ed_bn_ss','Bulimia Nervosa — Signs & Symptoms',{hy:1,kw:'bulimia signs symptoms enamel parotid'},[
 ul(['Chronically inflamed, sore throat','Swollen salivary glands (neck/jaw)','Worn tooth enamel; sensitive, decaying teeth (stomach acid)','Acid reflux and other GI problems; intestinal distress from laxatives','Severe dehydration from purging','Disrupted sodium, calcium, potassium, minerals → risk of <b>dysrhythmias and cardiac arrest</b>']),
 MN('<b>S-O-R-E</b> — <b>S</b>alivary gland swelling · <b>O</b>ral/enamel erosion · <b>R</b>eflux · <b>E</b>lectrolyte loss (↓K⁺ → arrhythmia). (study aid)')]),
C('ed_bn_dsm','DSM-5-TR Criteria — Bulimia Nervosa',{hy:1,kw:'bulimia dsm criteria weekly'},[
 ol(['<b>Recurrent binge eating</b>: (a) discrete period (e.g., within any <b>2-hour</b> period) an amount definitely larger than most would eat; (b) sense of <b>lack of control</b>.','<b>Recurrent inappropriate compensatory behavior</b> (vomiting; misuse of laxatives, diuretics, other meds; fasting; excessive exercise).','Both occur, on average, at least <b>once a week for 3 months</b>.','Self-evaluation unduly influenced by body shape and weight.','Does not occur exclusively during episodes of anorexia nervosa.'])]),
C('ed_bed','Binge-Eating Disorder (BED)',{hy:1,kw:'binge eating disorder bed'},[
 ul([MK('BED is the <b>most common</b> eating disorder in the United States.'),'Loss of control with recurring episodes of unusually large intake — <b>NOT followed by purging, excessive exercise or fasting</b> → often overweight/obese.']),
 H4('Signs & symptoms'),ul(['Unusually large amounts in a specific time (e.g., 2 hours)','Eating when full or not hungry; eating at a fast pace; until uncomfortably full','Eating alone/in secret (embarrassment)','Distress, shame, guilt about eating','Frequent dieting, possibly without weight loss']),
 MN('<b>F-U-L-L</b> — <b>F</b>ast · <b>U</b>ncomfortably full · <b>L</b>one/secret · <b>L</b>oss of control, with NO purging. (study aid)')]),
C('ed_bed_dsm','DSM-5-TR Criteria — Binge-Eating Disorder',{hy:1,kw:'binge eating disorder dsm three or more'},[
 ol(['Recurrent binge episodes (large amount within any <b>2 hours</b> + lack of control).','Associated with <b>3 or more</b>: eating much more rapidly; until uncomfortably full; large amounts when not hungry; alone because embarrassed; disgusted/depressed/very guilty afterward.','Marked distress about binge eating.','Occurs on average at least <b>once a week for 3 months</b>.','<b>Not</b> associated with recurrent inappropriate compensatory behavior; not exclusively during BN or AN.'])]),
C('ed_pica','Pica — Definition, Diagnosis & Treatment',{hy:1,kw:'pica nonfood'},[
 ul(['Repeatedly eating <b>non-food items with no nutritional value</b> (paper, dirt, soap, hair, glue, chalk). No usual aversion to food; items vary with age.','Inappropriate to developmental level; not culturally supported practice.',MK('DSM-5-TR: persistent eating of non-nutritive, nonfood substances for at least <b>1 month</b>.'),'Risks: intestinal blockage; toxic effects (e.g., <b>lead</b> in paint chips).','Most common in <b>children</b>; also intellectual disabilities and sometimes <b>pregnancy</b>.','<b>Treatment:</b> test for and treat nutritional deficiencies (esp. <b>iron and zinc</b>); behavioral interventions (redirect from nonfood items, reward setting aside/avoiding them); therapy/meds if comorbid psychiatric illness.'])]),
C('ed_pica2','Pica — Types, Risks & Causes',{kw:'pica geophagia pagophagia amylophagia'},[
 TB(['Type','Substance','Health risks'],[['<b>Geophagia</b>','Clay','Constipation, hypokalemia, nutritional deficiencies, parasites; lead poisoning if contaminated'],['<b>Pagophagia</b>','Ice','Iron deficiency (esp. pregnancy), tooth decay/sensitivity'],['<b>Amylophagia</b>','Starch','Iron deficiency; excess → high blood sugar/obesity'],['Toxic substances','Nonfood items','Lead, mercury, arsenic, fluoride → poisoning, neuro damage, organ dysfunction']]),
 P('<b>Pregnancy:</b> lead exposure → long-term neurological disabilities in children; maternal geophagy → childhood motor delays.'),
 P('<b>Cause unknown;</b> contributors: stress, cultural influences, learned behavior, low SES, underlying mental health disorders, nutritional deficiencies, child neglect, pregnancy, epilepsy, familial psychopathology.')]),
C('ed_arfid','Avoidant Restrictive Food Intake Disorder (ARFID)',{hy:1,kw:'arfid avoidant restrictive'},[
 ul(['Limits <b>amount or type</b> of food eaten. Unlike AN: <b>NO distorted body image or extreme fear of gaining weight</b>.','Most common in <b>middle childhood</b>; earlier onset than other EDs. Child doesn\'t eat enough calories to grow; adult not enough to maintain basic function.','<b>S&S:</b> dramatic restriction of types/amount; lack of appetite/interest in food; dramatic weight loss; unexplained GI upset/abdominal pain; increasingly limited preferred foods ("picky eating" that worsens).','<b>Not ARFID:</b> restriction from food unavailability, dieting, cultural practices (religious fasting), developmentally normal picky toddlers.','Increases mealtime stress for families. <b>Treatment:</b> individualized plan — mental health professional + registered dietitian.'])]),
C('ed_bmi','Body Mass Index (BMI) — Formulas & Categories',{hy:1,kw:'bmi weight status percentile'},[
 ul([MK('BMI = weight (kg) ÷ [height (m)]²  <b>or</b>  weight (lb) ÷ [height (in)]² × 703'),'BMI is a <b>screening</b> method — ignores muscle mass, bone density, body composition, racial/sex differences.']),
 TB(['Adult BMI','Weight status'],[['Below 18.5','Underweight'],['18.5 – 24.9','Healthy weight'],['25.0 – 29.9','Overweight'],['30.0 or higher','Obese']]),
 TB(['Child/teen BMI percentile','Weight status'],[['< 5th','Underweight'],['5th to < 85th','Healthy weight'],['85th to < 95th','Overweight'],['≥ 95th','Obese']]),
 IN('Children/teens: interpretation depends on age and sex; BMI is expressed as a percentile from a growth chart/calculator.')]),
C('ed_risk','Risk Factors & Etiology',{kw:'risk factors genetic environment social media'},[
 ul(['Exact cause not fully understood: combination of <b>genetic, biological, behavioral, psychological and cultural</b> factors. EDs are <b>hereditary</b>; brain imaging shows different activity patterns.','Environment plays a big role. Onset any time but commonly <b>adolescence/young adulthood</b> (peer, social media, advertising pressure to diet).','In the genetically vulnerable, initial weight loss can reinforce a <b>reward feedback</b> mechanism → maladaptive eating pattern; changes in hunger/satiety, GI motility, decisions about food.','Affects <b>all</b> genders, ages, races, weights, SES. Some are mild for life, then triggered by a major physical/emotional event.'])]),
C('ed_culture','Cultural Considerations',{kw:'cultural western thinness athletes'},[
 ul(['<b>AN</b> is associated with cultures that value thinness (Western cultures emphasize thinness → body dissatisfaction). Higher social media use → significantly greater odds of eating concerns.',MK('<b>Black and Hispanic teenagers</b> are more likely to suffer from <b>bulimia nervosa</b>.'),'Sports cultures where weight matters: <b>wrestling, gymnastics, figure skating, body building</b>.','Nurses should be culturally competent: understand norms, values, barriers to treatment.'])]),
C('ed_tx_gen','Treatment Overview & Psychotherapy',{hy:1,kw:'treatment cbt family-based interpersonal'},[
 ul(['Early treatment is important (↑ risk of suicide, self-injury, medical complications); treatment is more effective before chronicity, but long-standing EDs can recover. Rural areas: limited options → may need virtual therapy.','Plan may include: individual/group/family psychotherapy · medications · nutritional counseling · medical care & monitoring.',MK('<b>CBT</b>: reduce/eliminate binge eating and purging by modifying dysfunctional thoughts/behaviors about eating, body image, weight.'),MK('<b>Family-based therapy</b>: parents take an active role managing child\'s eating and weight restoration (monitor all eating/activity to prevent excessive exercise/purging); autonomy in feeding gradually returns to the adolescent. Very effective for adolescents.'),'<b>Interpersonal psychotherapy (IPT)</b>: improves interpersonal functioning and reduces ED symptoms.'])]),
C('ed_tx_meds','ED Medications & Nutritional Rehabilitation',{hy:1,kw:'fluoxetine lisdexamfetamine olanzapine dietitian'},[
 ul([MK('<b>Fluoxetine (SSRI)</b> — FDA-approved for <b>bulimia nervosa</b>; reduces binge–purge behaviors.'),MK('<b>Lisdexamfetamine</b> — approved for <b>binge-eating disorder</b>; decreases binge frequency.'),MK('<b>Olanzapine</b> — NOT FDA-approved for AN, but may promote <b>weight gain</b> and reduce anxiety in AN.'),'Antidepressants, antipsychotics, mood stabilizers may treat co-occurring anxiety/depression.']),
 H4('Nutritional rehabilitation'),ul(['Essential for <b>all</b> EDs: restore healthy eating patterns and correct malnutrition.','<b>Registered dietitian nutritionist</b> with specialized training: education on needs, planning and monitoring food choices.'])]),
C('ed_tx_set1','ED Care Settings — Outpatient, IOP, Partial Hospitalization',{hy:1,kw:'outpatient intensive partial hospitalization setting'},[
 TB(['Level','Client criteria'],[['<b>Outpatient</b>','Medically stable, maintains daily activities; regular visits with physician, therapist, dietitian.'],['<b>Intensive outpatient</b>','Medically AND psychiatrically stable; no daily medical monitoring; symptoms controlled enough to function socially/educationally/vocationally and progress.'],['<b>Partial hospitalization</b>','Medically stable; ED impairs functioning but no immediate risk; <b>needs daily assessment</b> of physiologic and mental status. Psychiatrically stable but unable to function normally; daily binge, purge, fasting, restriction or other pathogenic weight control.']]),
 P('Setting is guided by severity/chronicity, medical stability, insurance coverage and community resources.')]),
C('ed_tx_set2','ED Care Settings — Residential & Inpatient',{hy:1,kw:'residential inpatient unstable suicidal'},[
 ul(['<b>Residential:</b> medically stable, needs no intensive medical intervention; psychiatrically impaired and <b>unable to respond</b> to partial hospital/outpatient treatment.',MK('<b>Inpatient — medically unstable:</b> unstable/depressed vital signs; lab findings with acute health risk; complications from coexisting problems (e.g., diabetes).'),MK('<b>Inpatient — psychiatrically unstable:</b> rapidly worsening symptoms; <b>suicidal ideation with a plan and unable to contract for safety</b>.')])]),
C('ed_np_intro','Nursing Process — Intro & Assessment Priorities',{kw:'therapeutic relationship assessment perception'},[

C('ed_mse','Mental Status Exam Findings in EDs',{kw:'mental status exam mse russell'},[
 TB(['MSE component','Common findings'],[['Distress','Anxious, preoccupied with food/weight; shame, denial, resistance. BN more outwardly dysregulated; AN emotionally blunted.'],['LOC/orientation','Usually alert/oriented unless severely malnourished (confusion, poor concentration).'],['Appearance/behavior','Underweight (AN), normal (BN), overweight (BED); baggy clothes, pale/dry skin, lanugo, brittle hair/nails, <b>Russell\'s sign</b>, dental erosion; avoidant, perfectionistic.'],['Speech','Normal but guarded/evasive about food; may be pressured if anxious.'],['Motor','Restless/hyperactive (AN) or sluggish (malnutrition); ritualistic movements.'],['Mood/affect','Anxious, irritable, depressed; blunted/restricted (esp. AN); low self-worth.'],['Thought','Body-image distortion, weight obsession, fear of weight gain; rigid thinking. '+CR('* Suicidal ideation → notify provider immediately')],['Insight','Poor; deny underweight, minimize purging/restricting; resist weight restoration.'],['Cognition/judgment','Memory/attention intact unless malnourished; obsessive thoughts; judgment impaired by body image.']])]),
C('ed_psychosoc','Psychosocial Assessment & PQRSTU',{kw:'psychosocial pqrstu'},[

C('ed_suic_cfi','Suicide/NSSI Screening & Cultural Formulation Interview',{hy:1,kw:'suicide nssi self-injury cfi cultural formulation'},[

C('ed_obj','Objective Findings: Anorexia vs. Bulimia',{hy:1,kw:'anorexia bulimia comparison findings seizures'},[

C('ed_labs','Diagnostic & Lab Work',{kw:'laboratory ecg dexa'},[

C('ed_life','Life Span Considerations',{kw:'children adolescents older adults lifespan'},[

C('ed_plan','Planning: Safety & Hospitalization Criteria',{hy:1,kw:'hospitalization criteria 75% temperature safety'},[

C('ed_refeed','Refeeding Syndrome & Weight Restoration',{hy:1,kw:'refeeding syndrome hypophosphatemia weight restoration'},[
 DG('Negligible food intake for <b>more than 5 days</b> → risk of <b>refeeding syndrome</b> (potentially fatal).'),
 ul([MK('<b>Hallmark: hypophosphatemia</b>. Also sodium/fluid imbalance, glucose/protein/fat metabolism changes, <b>thiamine deficiency</b>, hypokalemia, hypomagnesemia.'),'Prevent: thorough nutritional assessment → <b>slow</b> reintroduction of nutrients/fluids per evidence-based guidelines. Severely malnourished may need therapeutic enteral nutrition.','AN weight restoration program: incremental gain; treatment goal <b>90% of ideal body weight</b>; dietitians set meal plans/calories; weighed <b>2–3 times/week</b>.','BN clients form a therapeutic relationship <b>faster</b> than AN (BN see behavior as a problem and want help; AN value control/safety of restriction).'])]),
C('ed_outpt','Outpatient Care & Family Recovery',{kw:'outpatient partial family recovery'},[
 ul(['Partial hospitalization for medically stabilized clients: in clinic by day, practice skills at home. Continues if client <b>maintains contracted weight</b>, vitals normal, no disordered eating behaviors.','Families feel frustrated, powerless, exhausted (forcing/begging didn\'t work). Nurse educates client and loved ones on illness, treatment, meal planning; reinforce adaptive coping skills.'])]),
C('ed_apna1','APNA Interventions: Coordination of Care & Health Teaching',{kw:'apna coordination of care health teaching'},[
 ul(['<b>Coordination:</b> communicate trends (suicide risk, target weight); target weight and daily calories set with dietitian and provider; interdisciplinary team (physician, dietitian, therapist, social worker) + family; refer to community/outpatient resources.','<b>Health teaching/promotion:</b> physical/psychological effects; nutrition, body image, coping in age-appropriate language; address myths; adaptive coping (journaling); meal planning, grocery shopping, social eating situations. Rationale: education ↑ insight, empowers recovery, reduces maladaptive beliefs.'])]),
C('ed_apna2','APNA Interventions: Pharmacological & Milieu Therapy',{hy:1,kw:'milieu observe meals one hour purging'},[
 ul(['<b>Pharm/bio/integrative:</b> teach about antidepressants and time to effect; monitor side effects and malnutrition signs (bradycardia, electrolyte imbalance); mindfulness, journaling, guided imagery.',MK('<b>Milieu:</b> structured, nonjudgmental environment with consistent meal and weigh-in routines; monitor for <b>food hoarding, purging, excessive exercise</b>.'),MK('Observe clients <b>during meals</b> (prevent hiding/throwing away food) and <b>at least 1 hour after eating</b> (prevent purging); close observation of bathroom trips; monitor access to laxatives/diuretics.'),'Calm, pleasant mealtimes; conversation not about eating/exercise; let clients make menu choices as they near goal weight.'])]),
C('ed_apna3','APNA Interventions: Therapeutic Relationship & Weighing Rules',{hy:1,kw:'weigh underwear blind pulmonary edema motivational interviewing'},[
 ul(['First priority: establish the therapeutic relationship; 1:1 communication; acknowledge emotional/physical difficulty; <b>motivational interviewing</b> + contracting.',MK('<b>Weigh daily in underwear for the first week, then 3×/week; NO oral intake before the morning weigh-in</b>; client may not view the scale (<b>blind weighing</b> in acute stage; open weighing later).'),MK('Expected gain ≈ <b>0.5 lb</b> on a schedule; <b>&gt; 5 lb in one week</b> can cause <b>pulmonary edema</b>.'),'Accurate weights are vital — clients may try to sabotage. Administer liquid supplements as prescribed; be alert for refeeding syndrome.','Confront irrational thoughts; monitor/individualize exercise plans; focus on strengths; external control initially, cognitive/behavioral change gradual.'])]),
C('ed_phys','Nursing Interventions for Physiological Signs',{hy:1,kw:'nutrition sleep elimination activity self-care hypokalemia'},[
 TB(['Problem','Key interventions'],[['<b>Nutrition</b>','Monitor weight, intake, behavior at meals; dietitian meal plan; supervise meals & post-meal; vitals/dehydration signs; labs <b>K⁺, Na⁺, Mg⁺⁺, phosphate</b>; watch bradycardia, hypotension, orthostasis, arrhythmias; encourage oral fluids but <b>restrict excessive water</b> (used for weight manipulation). Hypokalemia is life-threatening; early detection prevents sudden cardiac arrest.'],['Sleep/fatigue','Assess sleep; consistent sleep–wake cycle; limit naps; relaxation techniques.'],['Elimination','Assess constipation/diarrhea/laxative abuse; fiber and fluids; teach normal bowel patterns.'],['Activity/exercise','Assess compulsive/secretive exercise; set limits during refeeding/low BMI; alternative coping.'],['Self-care deficits','Assess ADLs; reinforce positive self-care (dignity, recovery).']])]),
C('ed_comm','Communication Tips for Clients With EDs',{kw:'communication tips'},[
 ul(['<b>Nonjudgmental, empathetic language</b> (shame/secrecy → less defensiveness).','<b>Avoid focusing on weight/appearance</b> — even positive comments reinforce disordered thinking; focus on behaviors, emotions, health.','<b>Validate emotions</b>, not just behaviors.','Be consistent; set clear, supportive boundaries.','Normalize discussion of food/body image struggles.','Collaborate on goals (autonomy, less resistance).','Frame meal plans as <b>health-supportive, not punitive</b>; open-ended questions ("What makes meals difficult for you?") instead of coercion.'])]),
C('ed_eval','Evaluation, Relapse & Resources',{kw:'evaluation relapse resources neda'},[
 ul(['Continuous review of progress toward SMART outcomes. <b>Relapse is common</b> — identify triggers and warning signs early; ongoing support is critical.','Long-term consequences: neurological disease, cardiac damage, blood pressure complications, <b>early-onset osteoporosis</b>.','Evaluate: weight stabilizing/healthier · vitals and labs normal · <b>menses return</b> · adherence to meal plan · ↓ restriction/binge/purge · therapy attendance · ↓ harmful behaviors · relationships/social participation · ↓ preoccupation · mood/anxiety · insight/motivation · healthier coping.','Resources: <b>NEDA</b> (support/treatment), <b>Eating Disorders Resource Group</b> (apps), <b>ANAD</b> (peer support groups).'])]),
C('ed_gloss','Chapter 13 Glossary (quick definitions)',{kw:'glossary definition'},[
 ul(['<b>Amylophagia</b> starch eating · <b>Geophagia</b> clay eating · <b>Pagophagia</b> ice eating','<b>Emaciation</b> extreme thinness · <b>Lanugo</b> fine hair all over body','<b>Purging</b> forced vomiting, laxatives, diuretics to compensate for overeating','<b>Refeeding syndrome</b> fatal complication after negligible intake &gt; 5 days','<b>Family-based therapy</b> parents actively manage eating/weight restoration','<b>Binge-eating/purging type</b> · <b>Restricting type</b> (AN subtypes)'])])

C('su_alc_od','Alcohol Overdose — Mechanism & Critical Signs',{hy:1,kw:'alcohol overdose bac gag reflex sleep it off'},[
 ul(['Too much alcohol → brain areas controlling ANS functions (<b>breathing, heart rate, temperature</b>) shut down. Opioids/sedative-hypnotics/benzos ↑ risk. Can cause permanent brain damage or death.','<b>BAC keeps rising</b> even after stopping drinking or passing out (alcohol in stomach/intestine still absorbing). Blackouts, loss of consciousness, death at high BAC.',DG('Never assume the person will "sleep it off." ↓ gag reflex → choking/aspiration. <b>Do not leave alone;</b> keep partially upright or roll onto side with ear toward ground.')]),
 H4('Critical S&S'),ul(['Mental confusion/stupor; can\'t wake','Vomiting; seizures','Slow respiratory rate (<b>&lt; 8 breaths/min</b>); irregular breathing (<b>≥ 10 seconds</b> between breaths)','Slow HR; clammy skin; ↓ gag reflex','Extremely low body temperature; bluish/pale skin'])]),
C('su_alc_tx','Medical Treatment: Alcohol Intoxication & Overdose',{hy:1,kw:'wernicke korsakoff thiamine dextrose alcohol treatment'},[
 ul(['Acute intoxication: hypotension + tachycardia (peripheral vasodilation/fluid loss). Check <b>BAC</b>; supportive care — vitals, <b>airway protection</b>, prevent hypoglycemia/hypotension/electrolyte imbalance. Ask about co-ingested opioids/benzos (naloxone may be needed).','Labs: glucose and electrolytes (hypoglycemia, ↓K, ↓Mg, ↓Ca, ↓phosphate, hyperlactatemia). Hypoglycemia → <b>IV dextrose</b>.',MK('<b>IV thiamine + dextrose</b> to prevent <b>Wernicke\'s encephalopathy</b> (nystagmus, ataxia, confusion — thiamine/B1 deficiency). Untreated → <b>Korsakoff\'s syndrome</b> (chronic, irreversible memory disorder).'),'Agitated/violent: benzodiazepines — <b>caution: worsen respiratory depression</b>. ~1% need ICU (abnormal vitals, hypoxia, hypoglycemia, parenteral sedation). Intubation/ventilation if inadequate respirations.','<b>Activated charcoal and gastric lavage are NOT helpful</b> (rapid absorption). CT head if mental status doesn\'t improve as BAC falls (head trauma). Overdose: advanced airway, ventilation, ICU monitoring.'])]),
C('su_op_intox','Opioids — Use, Intoxication & Overdose Signs',{hy:1,kw:'opioid intoxication overdose pinpoint pupils'},[
 ul(['2020: 9.5 M (3.4%) used opioids in past year; 9.3 M misused Rx pain relievers; 902,000 used heroin. Opioids act on CNS opioid receptors; misuse → relaxation/euphoria. Rx (morphine, oxycodone, hydrocodone, fentanyl, hydromorphone) = <b>Schedule II</b>; heroin = <b>Schedule I</b>. Injection risks: HIV, hepatitis B/C, bacterial endocarditis.',MK('<b>Intoxication:</b> initial euphoria → apathy, dysphoria, psychomotor retardation/agitation, impaired judgment; <b>pupillary constriction</b> (dilation in severe OD) + drowsiness/coma, slurred speech, impaired attention/memory.'),MK('<b>Overdose:</b> unconsciousness/can\'t awaken · <b>pinpoint pupils</b> · slow, shallow breathing (choking/gurgling/snoring sounds) or respiratory arrest · blue/purple lips or fingernails.')]),

C('su_op_waves','Opioid Overdose Waves, Fentanyl & Carfentanil',{kw:'waves fentanyl carfentanil'},[
 ul(['1999–2019: ~500,000 overdose deaths. <b>Wave 1 (1990s)</b> ↑ Rx opioid prescribing · <b>Wave 2 (2010)</b> heroin · <b>Wave 3 (2013)</b> synthetic opioids esp. <b>illicitly manufactured fentanyl</b>.','Pharmaceutical fentanyl (severe pain) vs. illicit fentanyl added to street drugs (more potent, addictive, dangerous).',MK('<b>Carfentanil</b>: used to tranquilize large mammals; ≈ <b>10,000× morphine</b>, <b>100× fentanyl</b>; <b>2 mg</b> can be lethal; can be absorbed through skin or inhaled → first responders/health care must follow safety protocols.')])]),
C('su_nalox1','Naloxone — Five Steps to Treat Opioid Overdose',{hy:1,kw:'naloxone five steps rescue breathing'},[

C('su_nalox2','Naloxone — Details, Routes & Monitoring',{hy:1,kw:'naloxone routes monitor four hours undertreated pregnant'},[

C('su_od_prev','Preventing Illicit Drug Overdose — Touchpoints',{kw:'overdose prevention touchpoints bystander institution'},[
 ul(['<b>~85%</b> of overdose deaths involve illicit fentanyl, heroin, cocaine or methamphetamine; &gt; 3 in 5 had missed opportunities for linkage to care.','Bystander present: ~<b>40%</b> of opioid/stimulant OD deaths.','Recent institutional release: ~10% (lost tolerance during abstinence). Previous overdose ~10%. Mental health diagnosis: <b>25%</b>. Prior SUD treatment: ~20%.','Prevention: link to treatment/recovery services + public education on naloxone.'])]),
C('su_cann1','Cannabis — Basics & THC Effects',{hy:1,kw:'cannabis marijuana thc'},[

 ul([MK('<b>Edibles/beverages:</b> effects delayed <b>30 min–1 h</b> (up to 2 h to feel full effect) → accidental overconsumption; less THC reaches blood; effects last many hours. Smoked effects last 1–3 h; THC detectable days–weeks.'),'<b>Delta-8 THC</b>: made from hemp-derived CBD; psychoactive; often labeled "hemp"; <b>not FDA-approved</b>; unsafe synthesis chemicals; <b>8%</b> of adverse-event cases need critical care.','Teens: THC affects still-maturing brain (to young adulthood) → long-lasting cognitive effects. Smoking: airway inflammation, ↑ resistance, hyperinflation, <b>chronic bronchitis</b>; THC vaping → serious lung disease/death.'])]),
C('su_cann3','Cannabis — Intoxication, Overdose, Treatment & Medical Uses',{kw:'cannabis intoxication dronabinol nabilone marinol cesamet'},[
 ul(['<b>Intoxication S&S:</b> conjunctival redness, ↑ appetite, dry mouth, tachycardia (+ impaired coordination, euphoria, anxiety, slowed time, impaired judgment, social withdrawal).','<b>Overdose:</b> fatal overdose from marijuana alone <b>unlikely</b> (CDC), but injury (crash, fall, poisoning); street marijuana may be laced with <b>fentanyl</b>.',MK('<b>Treatment:</b> supportive; quiet environment + reassurance; benzodiazepines for severe agitation/anxiety; <b>second-generation antipsychotics</b> for psychosis; inpatient for severe mood/psychotic symptoms; children who ingest may develop coma, convulsions, cardiopulmonary instability.'),MK('FDA-approved THC drugs: <b>dronabinol (Marinol)</b> and <b>nabilone (Cesamet)</b> — chemo nausea and appetite in AIDS wasting. Also used in MS (spasticity), epilepsy, Alzheimer\'s, Crohn\'s, PTSD, glaucoma.')]),
 PN('Lecture: RN licensing board does NOT treat marijuana as a legal substance for nurses — if drug tested you can lose your license.')]),
C('su_sed','Sedatives/Hypnotics/Anxiolytics — Intoxication, Overdose & Flumazenil',{hy:1,kw:'benzodiazepine sedative flumazenil overdose capnography'},[
 ul(['Examples: benzodiazepines (alprazolam, diazepam, lorazepam, chlordiazepoxide, clonazepam); hypnotic zolpidem. Chronic use ↓ GABA activity → tolerance; sudden stop → withdrawal.','<b>Intoxication</b> resembles alcohol: slurred speech, incoordination, unsteady gait, nystagmus, impaired cognition, stupor/coma. Standard urine drug screens do <b>not</b> detect benzos (specific tests needed).','<b>Overdose:</b> CNS depression, often co-ingested with alcohol/opioids → stupor, coma, respiratory depression. Monitor <b>end-tidal CO₂ (capnography)</b>; airway, bag-mask, intubation/ventilation.',MK('<b>Flumazenil</b> (benzodiazepine antagonist): use <b>cautiously</b> — can cause <b>withdrawal seizures</b> in tolerant clients. AHA: specific scenarios (pediatric exploratory ingestion, iatrogenic OD in procedural sedation) when chronic dependence/co-ingestion can be excluded. Adult: <b>0.2 mg IV over 15 s, repeat every 60 s up to 1 mg total</b>.')])]),
C('su_hall','Hallucinogens & PCP',{hy:1,kw:'hallucinogen pcp phencyclidine lsd ketamine'},[
 ul(['2020: 7.1 M (2.6%) ≥ 12. <b>Classic</b> (LSD, peyote) vs. <b>dissociative</b> (PCP, ketamine). Ketamine used medically (pain, depression). Risky behavior from altered perception (jumping off roofs, acting on suicidal thoughts).','<b>PCP</b>: illegal white powder (inhaled, injected, smoked, swallowed); intoxication → belligerence, assaultiveness, impulsiveness, unpredictability, agitation; violence and self-injury.',MK('PCP within 1 h (≥ 2 signs): vertical/horizontal <b>nystagmus</b>, <b>hypertension</b>, <b>tachycardia</b>, numbness/↓ pain response, ataxia, dysarthria, <b>muscle rigidity</b>, seizures/coma, hyperacusis.')])]),
C('su_hall2','Hallucinogens — Treatment, DXM & Overdose',{kw:'dextromethorphan hallucinogen treatment restraints lorazepam'},[
 ul([MK('Treatment: supportive; calm, <b>low-stimulation</b> environment; <b>benzodiazepines (e.g., lorazepam) first-line</b> for agitation; restraints only if severe risk followed by IV benzo sedation; short-term antipsychotics for persistent psychosis; ICU for hyperthermia/seizures/CV instability.'),'PCP overdose: seizures, coma, death (esp. with alcohol/benzos); cooling measures + anticonvulsants.',MK('<b>Dextromethorphan (DXM)</b> OTC cough suppressant misused at high doses: ~6,000 ED visits/yr; hallucinations, inappropriate laughing, psychosis, agitation, coma, tachycardia, dilated pupils, diaphoresis, "zombie-like" ataxic gait. Cough/cold meds often contain <b>acetaminophen</b> → delayed hepatotoxicity → <b>obtain serum acetaminophen level</b>.')])]),
C('su_stim1','Stimulants — Cocaine & Methamphetamine',{hy:1,kw:'stimulant methamphetamine cocaine crack dopamine'},[
 ul(['Amphetamines, cocaine, crack → <b>dopamine</b> flood → highly addictive; reward circuit adapts → ↑ doses; short high → <b>binging</b> (lose food/sleep). Use and withdrawal can cause <b>psychosis</b> (hallucinations, paranoia).','<b>Methamphetamine:</b> ~2 M used past year; smoked/swallowed/snorted/injected; made from <b>pseudoephedrine</b> → law requires pharmacies to limit sales and obtain photo ID. Lab toxicity/explosions. Long-term: extreme weight loss, severe dental problems, itching → skin sores, dyskinesia, anxiety, memory loss, violence.','<b>Cocaine</b> (coca leaves): 5.5 M users incl. ~778,000 crack users; "crack" = rock crystal heated and inhaled. Short-term ↑ BP, restlessness, irritability; long-term <b>MI and seizures</b>.'])]),
C('su_stim2','Stimulant Intoxication & Treatment (No Restraints, No Antipyretics)',{hy:1,kw:'stimulant intoxication hyperthermia restraints antipyretics benzodiazepines'},[
 ul(['<b>S&S:</b> tachy/bradycardia, pupillary dilation, ↑/↓ BP, perspiration/chills, N/V, weight loss, agitation/retardation, weakness, respiratory depression, chest pain, arrhythmias, confusion, seizures, dyskinesia, dystonia, coma. May develop <b>severe agitation with extreme violence</b> without provocation.',MK('Priorities: control <b>agitation</b> and <b>hyperthermia (&gt; 41°C)</b>. <b>IV benzodiazepines immediately</b> (first-line; prevent seizures).'),DG('<b>Avoid physical restraints</b> — struggling → isometric contractions → lactic acidosis, hyperthermia, sudden cardiac collapse, death.'),MK('<b>Aggressive cooling</b> (sedation, fluids, cooling blankets, evaporative cooling). <b>Antipyretics are NOT used</b> — heat is from muscle activity, not hypothalamic set point.'),'Airway/intubation PRN; continuous cardiac monitoring (arrhythmia/MI). Complications: <b>rhabdomyolysis, AKI, multiorgan failure</b> → IV hydration/renal replacement.'])]),
C('su_inh','Inhalants — Use, Intoxication & Treatment',{hy:1,kw:'inhalant sudden sniffing death amyl nitrate poppers'},[
 ul(['2.4 M (0.9%) — unlike other drugs, use is <b>highest in adolescents 12–17</b>. Spray paints, markers, glue, gasoline, cleaning fluids; sniffing, snorting, "bagging", "huffing." High lasts minutes → repeated inhalation. <b>Amyl nitrate</b> ("poppers") — Rx for chest pain, misused.','<b>Intoxication:</b> belligerence, assaultiveness, apathy, impaired judgment; dizziness, nystagmus, incoordination, slurred speech, unsteady gait, lethargy, ↓ reflexes, tremor, weakness, blurred/double vision, stupor/coma, euphoria.',MK('<b>Sudden sniffing death</b> (cardiac arrhythmia) can occur even in healthy young people on <b>first use</b>.'),'Long-term: liver/kidney damage, hearing loss, bone marrow damage, limb spasms, delayed development, brain damage.','<b>Treatment:</b> <b>100% oxygen by rebreather mask</b>, PALS protocols/intubation; remove from exposure; continuous cardiac monitoring; IV benzos for seizures; treat chemical pneumonitis, metabolic acidosis, liver/kidney injury.'])])
);
/* ===== TOPIC: SUBSTANCE USE — part 2 (14.3 withdrawal, 14.4 SUD, 14.5–14.6 neurobiology) ===== */
CARDS.substance.push(
C('su_wd_intro','Withdrawal Management (Detoxification) — Intro',{kw:'withdrawal management detoxification underreport'},[

C('su_alc_wd','Alcohol Withdrawal — Timeline (Mild → DTs)',{hy:1,kw:'alcohol withdrawal delirium tremens hallucinations seizures timeline'},[

 MN('<b>6-12-24-48-72</b>: 6 h tremor/anxiety → 12 h hallucinations → 24 h → 48 h seizures → 72 h DTs. (study aid)'),

C('su_ciwa','CIWA-Ar Scale',{hy:1,kw:'ciwa-ar scale alcohol withdrawal assessment'},[

C('su_alc_wd_tx','Alcohol Withdrawal — Treatment',{hy:1,kw:'benzodiazepine diazepam lorazepam chlordiazepoxide dexmedetomidine thiamine anticonvulsant'},[
 ul([MK('<b>Benzodiazepines</b> (diazepam, lorazepam, chlordiazepoxide) treat agitation and prevent progression to seizures/hallucinations/DTs.'),'<b>Precedex (dexmedetomidine)</b>, selective alpha-2 agonist: adjunct in severe cases (AWD delirium) or when benzos insufficient; sedation without significant respiratory depression; ↓ sympathetic outflow. Monitor <b>bradycardia and hypotension</b>.','<b>Anticonvulsants</b> ↓ withdrawal seizure probability (with or instead of benzos).','Chronic alcohol → <b>thiamine and magnesium</b> depletion: give <b>IV thiamine + dextrose</b> (prevent Wernicke\'s → Korsakoff\'s); correct other electrolytes; oral route if tolerated.']),
 PN('Lecture: benzodiazepines <b>replace GABA</b> during withdrawal; Ativan is shorter-acting; Librium is the other agent named (transcript unclear on its duration — verify). Choice may depend on patient\'s drinking pattern.')]),
C('su_gaba','Lecture: GABA–Glutamate "Teeter-Totter" & Dopamine Reward',{hy:1,kw:'gaba glutamate dopamine reward neurotransmitter'},[
 ul([LX('<b>GABA = inhibitory</b> (slows everything down); <b>glutamate = excitatory</b> (speeds up).'),'Drinking ↑ GABA (relaxed) and ↓ glutamate; body compensates by making more glutamate. Chronic use keeps GABA high; glutamate rebalances against the substance.','<b>Remove the substance</b> → nothing counterbalances → glutamate super high, GABA low → <b>anxiety, tremors, sweats, agitation</b> (neurotransmitter imbalance) → replace GABA with benzodiazepines.','<b>Dopamine</b> = reward neurotransmitter; brain releases it in response to cues (time of day, place, e.g., "home from work → drink"). Cues sustain craving.']),
 PN('Handwritten on slide: "Dopamine pathway — GABA ↑ inhibitor · Glutamate ↓ excite."')]),
C('su_op_wd','Opioid Withdrawal — Overview & COWS',{hy:1,kw:'opioid withdrawal cows clinical opiate withdrawal scale'},[

C('su_bup','Buprenorphine, Buprenorphine/Naloxone & Methadone',{hy:1,kw:'buprenorphine suboxone methadone cows precipitated withdrawal'},[

C('su_clon','Alpha-2 Agonists (Clonidine) & Symptom-Specific Meds',{hy:1,kw:'clonidine alpha-2 opioid withdrawal ondansetron loperamide dicyclomine'},[

 TB(['Symptom','Medications'],[['Anxiety/irritability/restlessness','Diphenhydramine, hydroxyzine, lorazepam, clonazepam'],['Abdominal cramping','Dicyclomine'],['Diarrhea','Bismuth, loperamide'],['Nausea/vomiting','Ondansetron, prochlorperazine, promethazine'],['Insomnia','Trazodone, doxepin, mirtazapine, quetiapine, zolpidem'],['Aches/headache','Ibuprofen, acetaminophen, ketorolac, naproxen'],['Spasms/restless legs','Cyclobenzaprine, baclofen, diazepam, methocarbamol']]),
 P('Warm baths, rehydration, gentle stretching help. <b>Avoid benzodiazepines/zolpidem with methadone or buprenorphine</b> unless closely supervised (oversedation).'),
 PN('Lecture tip: if a patient is on IV Dilaudid (hydromorphone), ask the provider to change to an <b>oral opioid before discharge</b> — they can\'t go home on IV; avoids withdrawal.')]),
C('su_benzo_wd','Benzodiazepine Withdrawal & Taper',{hy:1,kw:'benzodiazepine withdrawal taper seizures'},[
 ul(['Can be <b>life-threatening</b> (high dose/long duration). Early: tremors, anxiety, restlessness, malaise (rebound anxiety); later: hallucinations, agitation, depersonalization, psychosis/paranoia.',MK('<b>Seizures within 1–5 days</b> of abrupt cessation/rapid taper (generalized, life-threatening); autonomic instability (tachycardia, HTN, hyperthermia, diaphoresis).'),MK('Treatment: substitute short-acting benzo with a <b>long-acting</b> one (diazepam, clonazepam) then <b>taper</b> over weeks–months; reduce by no more than <b>10–25% every 1–2 weeks</b>.')])]),
C('su_stab','Withdrawal Management = Stabilization, Not Treatment',{hy:1,kw:'stabilization tolerance overdose after detox'},[

C('su_dsm','DSM-5 Criteria — Substance Use Disorder',{hy:1,kw:'dsm sud criteria tolerance withdrawal mild moderate severe'},[
 P('SUD = illness from repeated misuse of alcohol, caffeine, cannabis, hallucinogens, inhalants, opioids, sedatives/hypnotics/anxiolytics, stimulants, tobacco — all directly activate the <b>brain reward system</b>. Diagnosed by cognitive, behavioral, psychological symptoms.'),
 P(MK('<b>≥ 2 criteria in a 12-month period</b>')),
 ol(['Taken in larger amounts/longer than intended','Persistent desire/unsuccessful efforts to cut down','Great deal of time obtaining/using/recovering','<b>Craving</b>','Failure to fulfill major role obligations','Continued use despite social/interpersonal problems','Important activities given up/reduced','Recurrent use in physically hazardous situations','Continued use despite known physical/psychological problem','<b>Tolerance</b> (markedly ↑ amount needed OR markedly ↓ effect at same amount)','<b>Withdrawal</b>']),
 TB(['Severity','# of criteria'],[['Mild','2–3'],['Moderate','4–5'],['Severe','6 or more']]),

C('su_dep','Lecture: Substance Use Disorder vs. Dependency',{hy:1,kw:'dependency substance use disorder behaviors doctor shopping'},[
 ul([LX('<b>Physical dependence</b> (withdrawal after stopping a med, e.g., after 2 weeks of pain pills) does <b>NOT</b> by itself mean SUD.'),LX('<b>Behaviors cross the threshold into SUD:</b> multiple prescribers/pharmacies/paying cash (doctor shopping), taking more and more, relationship/job problems, taking others\' pills.'),LX('<b>Tolerance:</b> need more to get the same feeling.'),LX('<b>Primary defense mechanisms: denial and minimization</b> ("a glass or two" = a bottle or two; "a few pills" = 20–25).'),LX('Older adults may be <b>dependent</b> (pain) rather than addicted — differentiate; alcohol use is also high in older adults (widowhood, depression).')])]),
C('su_course','Addiction, Relapse, Recovery & Remission',{kw:'addiction relapse recovery remission'},[
 ul(['<b>Addiction</b> = severe SUD; compulsive/uncontrolled use; <b>chronic illness</b> with potential for relapse and recovery. SUD develops gradually; depends on substance, genetics, amount/frequency/duration.',MK('<b>Relapse</b> = return to use after significant abstinence — <b>not treatment failure</b>; rates similar to adherence rates for other chronic illnesses.'),'<b>Remission</b> = overcoming disorder with treatment; <b>recovery</b> = process of change to improve health/wellness and self-directed life (abstinence is primary but not the only healthy feature).','Of 29.2 M adults who ever had a substance use problem, <b>72.5%</b> consider themselves in recovery. Many clients in primary care/ob-gyn/ED/med-surg have undiagnosed SUD.'])]),
C('su_nurse','Substance Use Disorder in Nurses & Drug Diversion',{hy:1,kw:'nurse impaired colleague diversion diversion program board of nursing'},[
 ul([MK('It is a nurse\'s <b>legal and ethical responsibility</b> to report a colleague\'s suspected SUD to their manager/supervisor (chain of command).'),'Three significant signs: <b>behavioral changes</b> (↓ performance, long absences from unit, frequent bathroom trips, late/leaving early, excess errors incl. med errors), <b>physical signs</b> (appearance changes, isolation, inappropriate responses, confusion/memory lapses), and <b>drug diversion</b> (opioid count discrepancies, unusual wastage, many record corrections, frequent reports of ineffective pain relief, offers to medicate coworkers\' clients, altered verbal/phone orders).',MK('<b>Drug diversion</b> = redirecting medication for personal use, sale or distribution (theft, use, tampering). A <b>felony</b> → prosecution and loss of license.'),'Most states: nondisciplinary <b>Board of Nursing</b> program for treatment/recovery. Support colleagues returning to work.',LX('California: BRN disciplinary process and the <b>California Diversion Program</b>; assessment of impairment → report via chain of command.')])]),
C('su_gamble','Nonsubstance-Related (Behavioral) Addictions — Gambling Disorder',{hy:1,kw:'gambling disorder dsm four or more'},[
 ul(['Excessive behaviors: gambling, pornography, compulsive sex, Internet gaming, overeating, shopping, overexercising, technology — stimulate the same brain reward/addiction centers.',MK('<b>Gambling disorder is the ONLY nonsubstance disorder with DSM-5 criteria.</b> ≥ <b>4</b> criteria in 12 months; not better explained by a manic episode.'),'Criteria: needs ↑ money for excitement · restless/irritable when cutting down · repeated failed efforts to stop · preoccupied · gambles when distressed · <b>chasing losses</b> · lies · jeopardized relationship/job/education · relies on others for money (bailout).'])]),
C('su_neuro','Neurobiology — Neuroadaptation & Reinforcement',{hy:1,kw:'neuroadaptation reinforcement compulsivity impulsivity relapse'},[
 ul(['Addiction is a <b>chronic brain disease</b> (not a moral failing). <b>Neuroadaptations</b> → tolerance and periodic craving → relapse. <b>&gt; 60%</b> of clients relapse within 1 year of discharge; risk persists for years.','Initial use often <b>impulsive</b> (acting without foresight); pleasure = <b>positive reinforcement</b>; relief of stress/anxiety/depression = negative reinforcement; peer approval/relief of isolation also reinforce.',MK('Over time <b>impulsivity → compulsivity</b>; drivers shift from <b>positive reinforcement (pleasure)</b> to <b>negative reinforcement (relief from withdrawal)</b>: use to escape the "low," not get "high." Compulsive seeking + loss of control = key feature.')])]),
C('su_brain','Three Key Brain Regions',{hy:1,kw:'basal ganglia extended amygdala prefrontal cortex nucleus accumbens dorsal striatum'},[
 TB(['Region','Role in SUD'],[['<b>Basal ganglia</b>','Rewarding/pleasurable effects; habit formation. <b>Nucleus accumbens</b> = motivation & reward; <b>dorsal striatum</b> = habits/routines.'],['<b>Extended amygdala</b>','Stress response; unease, anxiety, irritability of <b>withdrawal</b>.'],['<b>Prefrontal cortex</b>','Executive function (organize, prioritize, time, decisions) incl. control over use.']]),
 IN('Changes persist long after use stops → high relapse incidence.')]),
C('su_cycle','Addiction Cycle — Three Stages',{hy:1,kw:'addiction cycle binge intoxication withdrawal negative affect preoccupation anticipation'},[
 TB(['Stage','Brain region','What happens'],[['<b>1. Binge/Intoxication</b>','Basal ganglia (nucleus accumbens)','Consumes substance; rewarding effects; dopamine + opioid signaling; positive reinforcement; cue learning'],['<b>2. Withdrawal/Negative Affect</b>','Extended amygdala','Negative emotional state without the substance; ↓ reward-circuit activation + ↑ stress neurotransmitters (CRF, norepinephrine, dynorphin)'],['<b>3. Preoccupation/Anticipation</b>','Prefrontal cortex','Craving; seeking again after abstinence; impaired executive function/decision-making/behavioral inhibition']]),
 MN('<b>B-W-P</b> = <b>B</b>asal ganglia → <b>W</b>ithdrawal (amygdala) → <b>P</b>refrontal cortex. (study aid)')]),
C('su_cycle2','Addiction Cycle — Neurobiology Details',{kw:'dopamine opioid thc gaba endorphins cues craving crf dynorphin'},[
 ul(['<b>Stage 1:</b> All addictive substances activate dopamine neurons (esp. <b>stimulants and nicotine</b>). Opioid system (endorphins; mu, delta, kappa receptors) mediates rewarding effects of <b>opioids and alcohol</b>, stimulating NAc directly or via GABA/DA. <b>THC</b> targets GABA neurons that stimulate DA and directly stimulates NAc. DA/opioid <b>antagonists block</b> drug-seeking.','<b>Cue learning:</b> people, places, paraphernalia, moods become linked to reward → trigger cravings even in recovery.','<b>Stage 2:</b> long-term use → dysfunction of DA reward system (long-lasting <b>↓ dopamine receptors</b>; smaller DA release) → ↓ pleasure from natural reinforcers (food, sex) → compulsive escalation. Stress neurotransmitters <b>CRF, norepinephrine, dynorphin</b> drive negative feelings and stress-triggered use; blocking them ↓ intake.','<b>Stage 3:</b> alcohol, cocaine, opioid disorders show impaired executive function; triggers (party with alcohol) + stress are hard to override.'])]),
C('su_risk1','Risk Factors — Early Life, Adolescence, Genetics',{hy:1,kw:'risk factors protective adverse childhood adolescence genetic'},[
 ul(['Factors: developmental, environmental, social, genetic, co-occurring MH disorders. <b>Protective factors:</b> positive self-image, self-control, social competence.','<b>ACEs</b> (abuse, neglect, household instability, poverty) set the stage.',MK('<b>Adolescence</b> = critical vulnerable period (risk-taking; <b>frontal/prefrontal cortex not fully developed until early–mid 20s</b>). ~<b>74%</b> of 18–30-year-olds in treatment began use at age ≤ 17. Earlier exposure = greater risk.'),MK('<b>Genetics</b> account for <b>40–70%</b> of individual differences in addiction risk (alcohol/nicotine metabolism genes, neurotransmitter receptors, drug memory); gene–environment interplay.')])]),
C('su_risk2','Risk Factors — Concurrent MH, Gender, Race/Ethnicity, Individual',{kw:'concurrent mental health gender race ethnicity east asian acetaldehyde'},[
 ul(['<b>2020:</b> 17 M adults (6.7%) had both SUD and any mental illness (AMI). Relationship is <b>bidirectional</b>; ↑ impairment, worse outcomes, mortality, cost, homelessness, incarceration, suicide. Explanations: substances mask symptoms; substances trigger MH disorder (alcohol ↑ PTSD risk); shared genes/neurobiology/trauma. Overlapping symptoms (chronic meth → paranoia/hallucinations mistaken for schizophrenia).','<b>Gender:</b> males drink more/↑ AUD; females progress faster to SUD with cocaine/opioids/alcohol; greater withdrawal (nicotine), higher cortisol.','<b>Race/ethnicity:</b> African American smokers ↑ prefrontal activation to smoking cues (lower cessation success); ~<b>36% of East Asians</b> carry a variant → <b>acetaldehyde buildup</b> (flushing, nausea, rapid heartbeat; protective but ↑ esophageal/head-neck cancer if drinking).','<b>Individual risk factors:</b> early initiation, early persistent problem behavior, rebelliousness, favorable attitudes, peer use, genetic predictors, academic failure (late elementary), lack of school commitment.',LX('Lecture: Japanese/Asian clients may flush because they lack the liver enzyme that metabolizes alcohol; alcoholism has a genetic component; Native American/Alaska Native alcohol-related death risk ~7× (as stated in lecture); Russian males\' life expectancy ~60.5 yrs vs. females 74.')])])
);

C('su_tx_intro','SUD Treatment — Chronic Care Model & Myths',{hy:1,kw:'chronic care myths treatment addiction myths'},[
 ul(['SUDs resemble <b>hypertension, diabetes, asthma</b> in course/management/outcome → chronic care approach. Remission/recovery achievable with evidence-based care for adequate periods + monitoring, recovery support, social services. Best strategy: <b>intervene early</b>. Barriers: myths, resources, training, workforce.']),
 TB(['Myth','Reality'],[['It\'s a choice/their fault','Contributing factors: genetics, neurobiology, ACEs, trauma'],['Willpower should work','Substances hijack the reward pathway → intense impulses despite consequences'],['Affects certain types of people','Anyone; ~1 in 8 aged ≥ 12'],['Stable job/family = no addiction','Anyone vulnerable; stigma/shame hides it'],['Must hit bottom first','Waiting → more brain changes, overdose; <b>forced treatment works as well</b> as voluntary'],['Rehab fixes it','Chronic disease: controlled, not cured; lifelong management'],['Relapse = never better','Relapse no more likely than other chronic illnesses; signals need to change treatment']]),
 P('<b>Mild SUD</b> → brief motivational interventions/supportive monitoring (<b>guided self-change</b>); <b>severe/chronic</b> → specialty treatment + post-treatment support.')]),
C('su_early','Early Intervention, Screening & SBIRT',{hy:1,kw:'early intervention screening brief intervention sbirt audit motivational interviewing'},[
 ul(['<b>Early intervention</b> (school clinics, primary care, MH clinics): reduce harms, reduce risk behaviors, prevent progression; education on risks/safe levels; referral PRN. Priority group: binge drinkers, esp. ages <b>12–17</b>. Brief interventions by a respected provider (nurse, physician) work.',MK('<b>SBI</b>: screen first (nonjudgmental; emphasize importance of reducing use + ability to do so); positive screen → brief tailored education; follow-up evaluation.'),MK('<b>SBIRT</b> = Screening, Brief Intervention, <b>Referral to Treatment</b> — referral when criteria for SUD are met or brief intervention doesn\'t change use.'),MK('<b>AUDIT</b> (WHO): world\'s most widely used alcohol screen; ~40 languages; self-administered <b>10 questions</b>, each scored <b>0 (never) to 4 (4+ times/week)</b>.'),'<b>Motivational interviewing (MI)</b>: client-centered, addresses ambivalence, client voices desire for change → plan/commitment; improves adherence and outcomes.'])]),
C('su_cage','Lecture: CAGE Questionnaire',{hy:1,kw:'cage questionnaire cut down annoyed guilty eye opener'},[

 MN('<b>C-A-G-E</b>: Cut down · Annoyed · Guilty · Eye-opener.'),
 P('Slide list of screening tools: SBIRT · AUDIT · CAGE · co-occurring disorders · motivational interviewing.')]),
C('su_ttm','Lecture: Transtheoretical Model (Stages of Change)',{hy:1,kw:'transtheoretical model stages of change prochaska diclemente precontemplation'},[
 ul([LX('Developed by <b>Prochaska and DiClemente</b>; assesses <b>readiness to change</b>; identify objective data/consequences; goals/follow-up.'),'Stages (in order): <b>Precontemplation → Contemplation → Preparation → Action → Maintenance</b>. <b>Relapse is part of the process.</b>','Textbook tie-in: tailor communication to the client\'s stage; explore rather than confront denial.']),
 MN('<b>P-C-P-A-M</b>: Precontemplation · Contemplation · Preparation · Action · Maintenance. (study aid)')]),
C('su_nida','NIDA Principles of Effective Treatment',{hy:1,kw:'nida principles treatment three months'},[
 ol(['SUDs are complex but <b>treatable</b> brain diseases; brain changes persist → relapse risk.','<b>No single treatment</b> is right for everyone — match setting/interventions/services.','Treatment must be <b>readily available</b> (lose clients if delayed).','Attend to <b>multiple needs</b> (medical, psychological, social, vocational, legal; tailor to age, gender, ethnicity, culture).',MK('Adequate duration critical: most need <b>at least 3 months</b>; longer = better; often multiple episodes.'),'<b>Behavioral therapies</b> (individual, family, group) most common; peer support helps maintain abstinence.','Continually evaluate/modify plan; recovery-oriented systems approach.','Treat <b>co-occurring mental disorders</b> with appropriate meds.','Treatment need <b>not be voluntary</b>; monitor use continuously (relapse signals plan change).','Test for <b>HIV/AIDS, hepatitis B & C, tuberculosis</b>; risk-reduction counseling.'])]),
C('su_meds','SUD Pharmacotherapy (Table 14.7)',{hy:1,kw:'pharmacotherapy naltrexone acamprosate disulfiram methadone buprenorphine'},[
 TB(['Medication','Use','DEA schedule','Application'],[['<b>Buprenorphine-naloxone</b>','Opioid use disorder','<b>CIII</b>','Detox or maintenance of abstinence'],['<b>Methadone</b>','Opioid use disorder','<b>CII</b>','Withdrawal and long-term maintenance; dispensed <b>only at SAMHSA-certified opioid treatment centers</b> approved by state'],['<b>Naltrexone</b>','Opioid AND alcohol use disorder','Not scheduled','<b>Blocks opioid receptors</b>, ↓ craving, ↓ rewarding effects; <b>extended-release injection</b> recommended to prevent relapse'],['<b>Acamprosate</b>','Alcohol use disorder','Not scheduled','Maintenance of abstinence'],['<b>Disulfiram</b>','Alcohol use disorder','Not scheduled','Severe reaction with alcohol (nausea, flushing, palpitations) → deterrent']]),
 ul(['Nicotine: NRT (patch, gum, lozenge, nasal spray) or oral <b>bupropion</b>/<b>varenicline</b> within a behavioral program.','Detox alone rarely leads to long-term abstinence — encourage continued treatment.'])]),
C('su_behav1','Behavioral Therapies I — CBT, DBT, Family, Contingency, CRA',{hy:1,kw:'cbt dbt family behavior therapy contingency management community reinforcement vouchers'},[
 ul([MK('<b>CBT</b>: modify maladaptive behaviors/dysfunctional thoughts, improve coping; short-term, usually <b>12–24 weekly</b> individual sessions; self-monitoring of cravings/relapse situations.'),'<b>DBT</b>: teaches <b>mindfulness</b> → mastery over cravings.',MK('<b>Family behavior therapy (FBT)</b>: adolescents and adults; up to <b>20 sessions</b>; skills/behavioral goals; family conflict, MH, ADLs, violence & HIV prevention.'),MK('<b>Contingency management</b>: tangible rewards (vouchers for food, movies, goods) for drug-free urine tests/participation → longer engagement and abstinence (cocaine, alcohol, opioid, meth).'),MK('<b>Community reinforcement approach (CRA) + vouchers</b>: intensive <b>24-week</b> outpatient; 1–2 counseling sessions/week; social network rebuilding; vouchers for drug-free urine several times/week.')])]),
C('su_behav2','Behavioral Therapies II — MET, Matrix Model, 12-Step Facilitation',{kw:'motivational enhancement matrix model twelve-step facilitation acceptance surrender'},[
 ul([MK('<b>Motivational enhancement therapy (MET)</b>: uses MI; empathy, discrepancy between goals and behavior, avoid argument/confrontation, address resistance, support self-efficacy.'),MK('<b>Matrix model</b>: structured multi-component; <b>16 weeks</b> of group sessions <b>3×/week</b> (CBT, family education, social support, individual counseling, urine testing; relapse prevention).'),MK('<b>Twelve-step facilitation (TSF)</b>: individual therapy, typically <b>12 weekly sessions</b>, prepares client to engage in AA/NA. Three ideas: <b>Acceptance</b>, <b>Surrender</b> (higher power/fellowship), <b>Active involvement</b>.')])]),
C('su_rss','Recovery Support Services (RSS) & Recovery Definitions',{kw:'recovery support services rosc abstinence personal growth service to others'},[
 ul(['RSS = case managers, recovery coaches, peers: navigate systems, remove barriers, social context for sober living. Participants have better long-term outcomes. <b>Recovery</b> goes beyond abstinence to whole-person change; many paths.','Study of &gt; 9,000 people: themes — <b>Abstinence</b> (86% included it), <b>Personal growth</b> ("being honest with myself" 98%; ~2/3 saw a spiritual dimension), <b>Service to others</b>.','<b>ROSC</b> (Recovery-Oriented Systems of Care): chronic care management — long-term outpatient care, recovery housing, coaching, checkups; navigable, transparent, culturally responsive.',MK('After remission (1–2 yrs), it takes <b>4–5 more years</b> for relapse risk to fall below <b>15%</b> (general population lifetime risk).')])]),
C('su_mutual','Mutual Aid, Recovery Coaches, Housing & Education Supports',{kw:'alcoholics anonymous al-anon alateen recovery housing coach'},[
 ul([MK('<b>AA</b> (since <b>1935</b>): social fellowship + <b>12-step</b> program; voluntary, free, member-led; NA, CA, MA, Crystal Meth Anonymous derive from it. Promotes recovery via supportive networks, coping, motivation, ↓ depression/craving/impulsivity.'),MK('<b>Al-Anon</b> (family/friends; &gt; 80% women) fosters emotional stability and <b>"loving detachment"</b> — not getting the loved one into treatment; <b>Alateen</b> for adolescents.'),'<b>Recovery coaches</b> connect to community services; <b>recovery housing</b> = substance-free, mutual support (months–years); <b>recovery community centers</b> host meetings, coaching, advocacy; <b>education-based supports</b> (high school/collegiate programs).'])]),
C('su_continuum','Treatment Continuum of Care & Settings',{hy:1,kw:'continuum residential partial hospitalization outpatient inpatient withdrawal management'},[
 ul(['Typical progression: <b>3–7 days</b> medically managed withdrawal → <b>1–3 months</b> residential → intensive outpatient (<b>2–5 days/week</b> for a few months) → traditional outpatient (<b>1–2×/month</b>). Recommend staying engaged <b>≥ 1 year</b> (3–4 programs at lessening intensity).']),
 TB(['Level','Description'],[['Medically monitored/managed <b>inpatient</b>','Acute hospital; 24 h; withdrawal management, medical/nursing care, co-occurring conditions'],['<b>Residential</b>','24-h non-hospital; physically/emotionally stabilized; unsupportive home, relapse history, co-occurring illness'],['<b>Partial hospitalization / IOP</b>','Step-down after residential; PHP 6–8 h/day on weekdays; living environment supports recovery but needs structure'],['<b>Outpatient</b>','Group/individual + meds; initial level for mild–moderate SUD or continuing care; suitable with concurrent MH conditions']])]),
C('su_barrier','Barriers to Treatment & Harm Reduction',{hy:1,kw:'barriers treatment harm reduction needle exchange nsduh'},[
 ul(['2020 NSDUH: <b>14.9% (41.1 M)</b> ≥ 12 needed treatment. Reasons not seeking: not ready to stop <b>40.7%</b> · no coverage/can\'t afford <b>30.6%</b> · job effects <b>16.4%</b> · don\'t know where to go <b>12.6%</b> · transportation/hours <b>11.8%</b> · no desired program <b>11.0%</b> · community opinion <b>8.3%</b>. Use <b>MI</b> to explore barriers.',MK('<b>Harm reduction</b>: outreach/education, <b>needle/syringe exchange</b>, overdose prevention education, public <b>naloxone</b> access — reduce overdose and HIV/infection transmission; engage those not ready for treatment.'),'Individualized plan: person-centered, strength-based; consider age, gender identity, race/ethnicity, language, health literacy, spirituality, sexual orientation, culture, trauma, comorbidities; periodically reassess. Nurses ↑ retention via therapeutic alliance, motivational strategies, addressing barriers, referrals (child care, housing, transportation).'])]),
C('su_prev','Prevention — Protective Factors & IOM Intervention Types',{hy:1,kw:'prevention universal selective indicated protective factors strengthening families basics coping power'},[
 ul(['CDC: &gt; <b>80,000</b> overdose deaths in 2024. A family member\'s SUD is an <b>ACE</b>.','<b>Protective factors</b> — individual: social/emotional/behavioral competence, self-efficacy, spirituality, resiliency; family/school/community: positive social involvement, recognition, bonding, committed relationships, healthy beliefs/standards.']),
 TB(['Type','Target','Examples'],[['<b>Universal</b>','Entire population','Minimum legal drinking age; <b>0.08 BAC</b> limit & license revocation (cut alcohol traffic deaths per 100,000 in half since early 1980s); <b>Strengthening Families Program</b> (7 sessions; effects up to 9 years) ; <b>I Hear What You\'re Saying</b> (Internet, 9 × 45-min; mothers/daughters)'],['<b>Selective</b>','High-risk subgroups','<b>Nurse-Family Partnership</b> (home visits for at-risk first-time mothers); <b>Familias Unidas</b> (Hispanic/Latino youth; 8 weekly 2-h groups + 4–10 home visits); <b>BASICS</b> (college students; two 1-h interviews)'],['<b>Indicated</b>','Already misusing, no SUD yet','<b>Coping Power</b> (16-month program, grades 5–6)']])]),
C('su_np_mse','Nursing Process — Assessment: MSE Findings in SUD',{kw:'mental status exam substance use disorder findings track marks'},[
 TB(['MSE component','Common findings'],[['Distress','Anxiety, agitation, discomfort, withdrawal S&S (tremor, sweating, nausea); drowsy/euphoric/dysregulated'],['LOC/orientation','Varies; confusion/disorientation esp. during withdrawal or OD of alcohol, opioids, benzos'],['Appearance','Disheveled/neglected; dilated or constricted pupils, slurred speech; <b>track marks</b> with IV use'],['Speech','Slurred, rapid, pressured, incoherent'],['Motor','Tremors, agitation/retardation, unsteadiness, falls'],['Mood/affect','Euphoric, irritable, anxious, depressed, flat; labile'],['Thought','Denial, guilt, paranoia, preoccupation with obtaining substances; hallucinations/delusions (e.g., alcohol hallucinosis)'],['Insight','Impaired — minimize/deny use'],['Cognition','Impaired attention/memory; poor judgment']])]),
C('su_np_psy','Assessment: Psychosocial, PQRSTU, Suicide, CFI & FICA',{hy:1,kw:'pqrstu fica spiritual cultural formulation suicide pss-3'},[
 ul(['Psychosocial components same as ED chapter; PQRSTU used for organized questions (e.g., "What usually leads you to drink?").','<b>Suicide screening:</b> PSS-3 for all clients in acute care; explain purpose/normalize questions. <b>NSSI</b> = self-injury without suicidal intent.','<b>CFI</b> (cultural formulation interview): cultural definition of problem; cause/context/support (family alcohol use, celebrations, rituals); coping/help-seeking (traditional remedies, community help); nurse–client relationship.',MK('<b>FICA©</b> spiritual history: <b>F</b>aith · <b>I</b>mportance · <b>C</b>ommunity · <b>A</b>ddress in care. Recognize spiritual distress / belief in divine punishment (worsens anxiety); offer chaplain.')])]),
C('su_np_hx','Assessment: History, Screening Scales & Labs',{hy:1,kw:'history labs urine drug testing ecg hcg amylase lipase'},[
 ul([MK('<b>Substance use history:</b> substances, <b>time of last use</b>, duration, quantity/frequency, method (oral, IV, inhaled, intranasal) → predicts <b>timing/severity of withdrawal</b>; family history.'),'Prior withdrawal & treatment history (inpatient/outpatient, AA, naltrexone/acamprosate); mental health history (integrated treatment); social history (supports/barriers); medical history; comprehensive physical exam (liver/pancreatic disease in AUD).','Scales: <b>CIWA-Ar</b> (alcohol), <b>COWS</b> (opioids).']),

C('su_np_life','Life Span Considerations (Children/Adolescents & Older Adults)',{hy:1,kw:'adolescents older adults life span substance'},[
 ul(['2020: ~10 M US adolescents met SUD criteria (most untreated); <b>&gt; 90%</b> of adults with SUD began in adolescence. Risks: STDs, poor family planning, justice involvement, school problems, neurocognitive impairment, mental illness; leading causes of death (unintentional injury, suicide, violence). Warning signs: irritability, truancy, ↓ grades, secretiveness, family withdrawal; don\'t dismiss as "normal adolescence"; consider ADHD/anxiety/depression.','<b>Older adults:</b> late-life stressors (grief, retirement, isolation, chronic illness); Rx opioid/benzo misuse; falls, memory loss, confusion, sleep problems, withdrawal mistaken for <b>dementia</b>; holistic care.'])]),
C('su_np_dx','Nursing Diagnosis, Outcomes & Safety',{kw:'acute substance withdrawal syndrome smart outcomes'},[

C('su_np_apna','APNA Interventions for SUD (Table 14.9d)',{hy:1,kw:'apna interventions coordination teaching milieu therapeutic relationship'},[
 ul(['<b>Coordination of care:</b> multidisciplinary team (physician, addiction counselor, social worker, pharmacist); referrals to detox/rehab/recovery programs.','<b>Teaching/promotion:</b> effects of substances; <b>MI</b> for behavior change and harm reduction (↑ insight, self-efficacy, readiness).','<b>Pharm/bio/integrative:</b> naltrexone, buprenorphine, acamprosate; monitor withdrawal, side effects, adherence; mindfulness/guided imagery for cravings.','<b>Milieu:</b> safe, structured, <b>substance-free</b>; peer groups/12-step; clear expectations/boundaries.','<b>Therapeutic relationship:</b> nonjudgmental, empathetic, trust; client-led goals; explore trauma/mental illness underlying use.'])]),
C('su_np_phys','Interventions for Physiological Signs & Self-Care Deficits (Table 14.9e)',{hy:1,kw:'withdrawal nutrition sleep pain elimination respiratory self-care naloxone'},[
 TB(['Problem','Key interventions'],[['<b>Withdrawal</b>','CIWA-Ar/COWS; meds (benzos, methadone, clonidine); quiet low-stimulus environment'],['Nutrition/hydration','Weight/BMI; I&O, turgor, mucosa; electrolytes/replacement (Mg, K); oral fluids; nutrient-dense meals; <b>thiamine, folic acid, multivitamins</b>; dietitian'],['Sleep','Sleep hygiene (↓ noise, dim lights, no caffeine); assess night sweats/nightmares; relaxation'],['Pain','<b>Non-opioid</b> (acetaminophen, heat, distraction); assess <b>hyperalgesia</b> in opioid users'],['Elimination','Antiemetics, fiber, stool softeners; small frequent meals'],['<b>Respiratory</b>','Assess for respiratory depression (opioids/benzos); SpO₂ and RR; <b>have naloxone available</b> per protocol'],['Self-care deficits','Assess hygiene/ADLs; structured routines; positive reinforcement']])]),
C('su_np_comm','Communication Tips for Clients With SUD',{kw:'communication person-first language readiness for change relapse normalize'},[
 ul(['<b>Person-first language</b> ("person with a substance use disorder," not "addict/alcoholic").','Tailor to <b>stage of change</b> (precontemplation, contemplation…).','<b>Explore rather than confront denial</b> ("What do you think others are concerned about?").','Avoid power struggles/ultimatums; collaborate.','Reflect strengths/past successes (build self-efficacy).','Consistent, compassionate boundaries.','<b>Normalize relapse</b> ("Relapse doesn\'t mean failure").'])]),
C('su_np_wd','Withdrawal Treatment — Nursing Care & Evaluation',{hy:1,kw:'withdrawal nursing care seizure precautions fall thiamine magnesium evaluation'},[

C('su_lec_class','Lecture: Drug Class Lists (Depressants, Stimulants, Opiates, Hallucinogens)',{hy:1,kw:'depressants barbiturates stimulants amphetamines opiates hallucinogens list'},[
