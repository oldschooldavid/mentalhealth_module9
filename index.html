 ul(['Children depend on others; abusive, rejecting or overly controlling parents cause detrimental effects; family = main context and modeled behaviors shape worldview. Trauma strongly correlates with adult dysfunction.',MK('<b>Neglect is the most common form of child abuse:</b> <b>75%</b> neglected · <b>17%</b> physically abused · <b>8%</b> sexually abused.'),'<b>Girls</b> more likely than boys to be sexually abused; under-reported due to stigma/shame.','Witnessing violence is traumatic; abused children are at risk of becoming abusers, acting out, bullying, dysfunctional relationships.','Psychosocial adversity: poverty, overcrowding, incarcerated parents, in/out of hospitals, natural disasters, drug/alcohol abuse, domestic violence → <b>PTSD</b>. Ask who is caring for the children.'])]),
C('ch_dev','Effects of Mental Disorders on Development',{kw:'development erikson stage onset developmental tasks'},[
 ul(['<b>Developmental stage at onset</b> determines how the child is affected; disorders may make <b>future developmental tasks harder</b> and affect lifetime development (e.g., substance use starting at 15 → tends to stay at that developmental stage).','Adults who never learned relationships in childhood may develop major depression. Think <b>Erikson</b>: trust, autonomy vs. shame, industry vs. inferiority, identity vs. role confusion.',MK('<b>Development-promoting nursing interventions:</b> <b>normalizing experiences · adapting environments · promoting coping skills</b>.')])]),
C('ch_lang','Language & Speech Disorders',{hy:1,kw:'language speech receptive expressive stuttering phonological'},[
 ul([MK('<b>Receptive</b> = difficulty <b>understanding</b> others (hearing loss, not understanding meaning); <b>Expressive</b> = difficulty <b>communicating</b>.'),'<b>Stuttering</b> = a type of anxiety that can cause frustration; prevalence <b>25% of 5-year-olds, 2% of 8-year-olds</b> (as stated). <b>Phonological disorder</b> = failure to produce sounds/organize sounds into words (substitutes one sound for another, e.g., T for K).','Consider <b>bilingual/bicultural</b> children. Referral: Inland Regional Center — federally funded, ages <b>0–3, free</b> if they qualify; after age 3 the <b>school districts</b> test.'])]),
C('ch_learn','Learning Disorders — Dyslexia, Dyscalculia, Dysgraphia',{hy:1,kw:'learning disabilities dyslexia dyscalculia dysgraphia'},[
 ul(['Difficulty in one or more learning areas <b>despite normal intelligence/motivation</b>. Signs: trouble telling right from left, reversing letters, recognizing patterns/sorting, following instructions, remembering, poor coordination.',MK('<b>Dyslexia</b> (most common; letters backwards) — <b>rule out hearing/vision problems first</b>. Clue at ages 11–12: refuses assignments/menu, angry, "I don\'t want to read" → ask "Are you having difficulty reading the menu?"'),MK('<b>Dyscalculia</b> — math; trouble following sequences/counting objects; usually found late (~5th grade).'),MK('<b>Dysgraphia</b> — writing; grammar/punctuation/paragraph errors; trouble holding utensils, instruments, fastening clothing.'),'Low self-esteem and bullying are common. Ask about learner type (visual → written/pamphlet instructions).']),
 MN('<b>Dys-LEX / CALC / GRAPH</b> = reading · math · writing. (study aid)')]),
C('ch_id','Intellectual Disabilities',{hy:1,kw:'intellectual disability iq 70 dsm-5'},[
 ul([MK('Sub-average intelligence — <b>IQ of 70 or less</b> (criteria change about every 10 years).'),MK('<b>DSM-5:</b> deficits in <b>intellectual functions</b> + deficits in <b>adaptive functioning</b> + <b>onset during developmental period</b>.'),'First diagnosed in infancy/childhood; levels vary — the more severe, the earlier the signs.'])]),
C('ch_tic','Tic Disorders & Tourette Syndrome',{hy:1,kw:'tics tourette motor vocal echolalia'},[
 ul([MK('Affect ~<b>1%</b> of school-aged children. Tics = sudden twitches/movements/sounds repeated without ability to stop.'),'<b>Motor</b> (blinking, shrugging, twitching arms) — often <b>first</b> symptom; <b>vocal</b> (sounds, words, swearing, <b>echolalia</b> = repeating others\' words). Onset <b>5–10 yrs</b>; most decrease in adolescence, may last into adulthood.','<b>Treatment:</b> behavioral modification + medications.'])]),
C('ch_sud','Substance Use in Youth (Lecture Statistics)',{hy:1,kw:'substance use adolescents alcohol binge drinking parents'},[
 ul([MK('Alcohol is the most commonly used substance in youth: <b>29%</b> drink, <b>14%</b> binge, <b>5%</b> drove under influence, <b>17%</b> rode with someone under the influence.'),MK('Binge drinking: <b>≥ 5 drinks (males)</b>, <b>≥ 4 (females)</b> at one time.'),'SUD affects ~20 million people aged ≥ 12 (as stated in lecture).','Teach parents to talk to their kids — "knowledge is power"; give resources.'])]),
C('ch_gd','Gender Dysphoria & Sexual Orientation',{hy:1,kw:'gender dysphoria transgender lgbt'},[
 ul(['Gender assigned at birth by medical assessment of genitalia; <b>gender identity, roles, expression</b> = psychological/cultural aspects.',MK('<b>Gender dysphoria</b> = biological sex differs from gender identity with unease about the incongruence. <b>Transgender</b> = identity/expression differs from sex assigned at birth. <b>Sexual orientation</b> differs from gender identity/expression; <b>5–10%</b> of teens identify as lesbian, gay or bisexual.'),'<b>Risks:</b> child abuse, bullying, sexual harassment, violence (esp. teen dating), unprotected sex/STDs, pregnancy, depression, anxiety, <b>suicidal ideation</b>, altered body image, ↑ adolescent SUD.','<b>Nursing role:</b> ask children/adolescents about gender preferences; provide support, resources, education; be a positive role model and model empowerment.'])]),
C('ch_teach','Teaching Strategies for Children & Parents',{kw:'teaching strategies learning needs self-efficacy chores praise'},[
 ul(['Assess <b>all children for learning disorders</b>; the type suggests approach; know strengths/challenges; <b>adapt teaching to individual learning needs</b> (age-appropriate, matched to developmental stage).','Example (child 8–9 with new diabetes): <b>teach the parent first</b>, empower the parent to teach the child, give parents teaching strategies; child performs skills when parent judges ready.','Learning/communication disorders: involve <b>play</b>, diagrams, pictures, demonstrations, lists; computers can replace writing; physical activity. Resources via county office of education/Head Start.','Help kids <b>succeed</b>: small tasks, chores (ages 2–10) → self-efficacy/responsibility; praise, tokens/allowance; <b>delay gratification</b> to build frustration tolerance and resilience.'])]),
C('ch_adhd1','ADHD — Definition, Types & Symptoms',{hy:1,kw:'adhd types inattentive hyperactive combined'},[
 ul([MK('<b>ADHD</b> = neurodevelopmental disorder (an <b>externalizing</b> behavior). Higher risk of depression, SUD, suicide; ~8% increase after COVID (lecture).'),'Symptoms: trouble paying attention, controlling impulses, overactivity, can\'t sit still, difficulty getting along.']),
 TB(['3 types','Features'],[['<b>Predominantly inattentive</b>','Difficulty finishing tasks, attending to detail, following instructions; easily distracted; forgetful'],['<b>Predominantly hyperactive-impulsive</b>','Fidgeting, talking a lot, can\'t sit still, restless; interrupts, grabs things, can\'t wait turn'],['<b>Combined</b>','Both equally']]),
 MN('<b>I – H/I – C</b>: Inattentive · Hyperactive/Impulsive · Combined. (study aid)')]),
C('ch_adhd2','ADHD — Causes & Treatment',{kw:'adhd causes treatment parent training behavioral'},[
 ul(['<b>Causes:</b> genetics, traumatic brain injury, environmental exposures, alcohol/tobacco during pregnancy, premature delivery, low birth weight. <b>One-third</b> continue with ADHD into adulthood.',MK('<b>Treatment = behavioral therapy + medication.</b> For ages <b>4–5:</b> <b>parent training in behavior management is first-line</b>. Psychotherapy improves behavior, self-control, self-esteem.'),'Behavior tips: break assignments into small tasks; mini-breaks; set success; <b>never use "no, don\'t, stop, quit"</b> — use "I like it when you use your walking feet/inside voice"; consistent rules/consequences for both parents; positive reinforcement; clear limits; simple instructions; time-outs.'])]),
C('ch_adhd_meds','ADHD Medications — Stimulants, Strattera, Clonidine & Priapism',{hy:1,kw:'stimulants ritalin adderall dexedrine strattera atomoxetine clonidine priapism'},[
 ul([MK('<b>Baseline:</b> comprehensive medical exam before starting; monitor for side effects.'),MK('<b>Stimulants (Ritalin, Dexedrine, Adderall)</b> = <b>first-line</b> (rapid onset, safety); MOA unknown, affects dopaminergic/noradrenergic systems; <b>Schedule II</b> → monitor abuse/dependence.'),'Side effects: insomnia, ↓ appetite, weight loss, stomach pain, headache. Assess <b>height/weight</b> — failure to grow is a concern: talk to parents, ask about eating, suggest large breakfast and after-dinner snacks, consult physician/RD. <b>Ritalin: last dose ≥ 6 hours before bedtime.</b>',MK('<b>Strattera (atomoxetine)</b>: non-amphetamine SNRI; useful with anxiety/depression; duration only <b>10–12 h</b>; dose by weight; <b>↑ risk of suicidal thinking</b> in children/adolescents — monitor.'),'<b>Clonidine</b> (alpha-2 adrenergic agonist): when other meds fail. Parent education: abuse/dependency potential, CV risks, growth suppression, psychiatric risks; monitor weekly, adjust dose.',DG('<b>Priapism</b> (irreversible erection; seen with trazodone and possibly ADHD meds) = <b>medical emergency</b> → go to ER right away.')])]),
C('ch_odd','Oppositional Defiant Disorder (ODD)',{hy:1,kw:'oppositional defiant disorder odd'},[
 ul([MK('Behavioral disorders diagnosed when behavior is uncommon for age, <b>persistent, or severe</b>. <b>ODD:</b> disobedience, argumentative, angry outbursts, low frustration, <b>blames others</b>; conflict with adults, trouble making friends; overlaps with ADHD.'),MK('~<b>16%</b> of school-aged children; starts <b>before age 8</b>, typically not later than <b>12</b>; opposite of what asked; often oppositional with people they know well.'),'Comorbid: PTSD/anxiety, ADHD, autism, learning disabilities, substance use. Hospital care is difficult (pull IVs, remove dressings, refuse food).','<b>Treatment:</b> parent behavior management training · individual therapy (anger management) · family therapy (communication) · CBT · social skills training.'])]),
C('ch_cd','Conduct Disorder → Antisocial Personality Disorder',{hy:1,kw:'conduct disorder antisocial personality girls'},[
 ul([MK('<b>Conduct disorder</b> (more serious than ODD): serious violations of social standards — aggression, vandalism, cruelty to animals, stealing, lying, truancy; bullying, forcing sex, manipulation, no remorse.'),MK('Without early intervention → <b>antisocial personality disorder in adulthood</b> (lecture question answer #1).'),'Teens: SUD and criminal behavior. <b>Girls:</b> lying, promiscuity, older boyfriends, illicit drugs, STDs → <b>test for pregnancy, ask about suicidal ideation</b>; less confrontational.','Treatment: behavioral programs + therapy; <b>avoid grouping too many chronic-disorder children</b>; meds only for comorbid mood/anxiety/impulsivity. Behavioral training for parents; nursing goals for ODD/CD: ↓ loneliness, ↑ self-esteem.'])]),
C('ch_anx_dep','Anxiety & Depression in Children',{hy:1,kw:'anxiety depression children separation panic phobia'},[
 ul(['All children have some anxiety; problem when overly worried. <b>Assess home environment</b>, bullying, ACEs; refer to mental health (psych consult). Anxiety disorders are <b>internalizing</b> behaviors.','Anxiety types: <b>separation</b> (afraid away from caregivers), <b>phobias</b>, <b>social anxiety</b> (school/places with people), <b>generalized</b> (worry about future), <b>panic disorder</b> (episodes of intense fear with physical effects), agoraphobia, PTSD.',MK('<b>Depression assessment:</b> withdrawn/sad for <b>≥ 2 weeks</b>? loss of interest? changes in eating, sleeping, energy, attention; suicidal ideation; worthlessness; physical symptoms; substance use; <b>ask about self-harm</b>. Higher risk with other conditions; ages 8–11 let them do homework for sense of purpose.'),'Treatment: <b>CBT + antidepressants</b> ± individual/family therapy.'])]),
C('ch_ptsd_elim','PTSD, Separation Anxiety & Elimination Disorders',{hy:1,kw:'ptsd separation anxiety enuresis encopresis art therapy'},[
 ul([MK('<b>PTSD</b> in young children (domestic violence, fires, shootings, loss): nightmares, bedwetting, temper tantrums, not sleeping, afraid to go into bedroom, withdrawing, whining — <b>best treated with art therapy</b> ("What color is your pain?").'),'<b>Separation anxiety:</b> ~<b>4%</b> of school-aged children; environmental + genetic.',MK('<b>Enuresis</b> = bedwetting; diagnosis: <b>2 episodes/week for 3 consecutive months</b>; age <b>≥ 5</b>; reassure both parents love/support; wake at night, void at bedtime and mid-night; causes: stress (divorce), faulty toilet training.'),'<b>Encopresis</b> = repeated passage of feces in inappropriate places; often anger/hostility directed at the parent.'])]),
C('ch_se','Promoting Self-Esteem in Children — Nursing Care',{hy:1,kw:'self-esteem nursing care promote honest feedback low-risk'},[
 ul(['<b>Self-esteem</b> = positive regard/respect for oneself; results from <b>repeated accomplishments</b> and assigned achievable responsibilities.','Help child <b>learn from failures</b> ("no one wins every time"); help build skills; keep goals within ability; teach <b>positive affirmations</b>, avoid negative self-talk; allow frustration (let them struggle; don\'t say "hurry up").',MK('<b>Provide honest feedback</b> (builds trust); <b>avoid flattery/insincere compliments</b>; unconditional love; <b>respect the child</b>; offer <b>low-risk experiences</b>; balance what they can vs. can\'t control; give choices ("either…or time-out"); prompt before bedtime ("five more minutes").')])]),
C('ch_se_signs','Signs & Symptoms of Low Self-Esteem (and Contributors)',{kw:'low self-esteem signs symptoms cutting'},[
 ul(['Negative self-talk · dislikes body/appearance · persistent guilt/shame · <b>worthlessness</b> · <b>powerlessness</b> · passiveness · shyness · poor personal hygiene.','Contributors: poverty, neglect, abuse, violence exposure, maternal depression, antisocial behavior, loss of friend/family to suicide/SUD; <b>school failure is a key feature</b> (poor grades).','Assess for drug/alcohol use and <b>cutting to cope</b> with stress/rejection. Learning disabilities → bullying/low self-esteem; ADHD → disruptive, impulsive. <b>Raise self-esteem, ↓ loneliness:</b> social skills groups, team sports.'])]),
C('ch_asd1','Autism Spectrum Disorder (ASD) — Overview, Causes & Treatment',{hy:1,kw:'autism spectrum disorder asperger causes risk factors treatments'},[
 ul([MK('<b>ASD</b> = developmental disorder affecting communication and behavior; <b>2.3%</b> of US children. Difficulty with communication/interaction; restricted interests, repetitive behaviors; impaired function in school/work.'),'<b>Asperger\'s</b> (per lecture): aloof/different with others, clumsy, problems with empathy, stunted social skills.','<b>Causes/risk:</b> sibling with autism, older parents at birth, genetics, <b>Down syndrome, Fragile X</b>, low birth weight.',MK('<b>Treatments:</b> behavioral (applied behavior analysis), developmental approaches, occupational, physical, speech/language therapy, educational approaches. <b>No medications used to treat autism</b> (per lecture). Look for signs of abuse; parents\' care is challenging — programs exist.')])]),
C('ch_asd2','ASD — Characteristics & Nursing Interventions',{hy:1,kw:'autism halt characteristics nursing interventions echolalia routine'},[
 ul(['<b>Characteristics:</b> disturbed social relationships; acts as if cannot see/hear you; no response to stimuli; dislikes certain food/clothing textures; <b>echolalia</b>, hand flapping; unable to concentrate; poor play; irritability with noise; doesn\'t like people close; agitated responses. <b>Poster:</b> inappropriate laughing; no real fear of danger; apparent insensitivity to pain; avoids cuddling/eye contact; prefers to be alone; difficulty expressing needs (uses gestures); attachment to objects; insistence on sameness; spins objects/self; unusual repetitive play; uneven physical/verbal skills.','Nursing dx: profound disturbance (per lecture) — <b>Impaired social interaction, Impaired verbal communication</b>.','<b>Hospital care:</b> parents at bedside; schedule like home; communication <b>simple, concrete, brief</b> (no abstract thinking); <b>daily routine, rest time, lighting, reduce stimuli, quiet spaces</b>.']),
 MN('<b>H-A-L-T</b> when misbehaving: <b>H</b>ungry? <b>A</b>ngry? <b>L</b>oud (too loud)? <b>T</b>ired? — also teach parents. (lecture)')]),
C('ch_assess','General Nursing Assessment of Children',{kw:'assessment mental status developmental family history school suicide'},[
 ul(['Mental status assessment (like adults but adapted to developmental stage, cognition, verbal skills) · developmental assessment (milestones: walking, talking, toilet training) · behavioral observation · family history · social history · school information.',MK('<b>Suicide risk:</b> child in despair with no hope → <b>ask directly</b> "Are you thinking about hurting or killing yourself?" — <b>asking will not give them the idea</b>.')])]),
C('ch_dx','Nursing Diagnoses for Children',{kw:'nursing diagnoses chronic low self-esteem ineffective coping violence'},[
 ul(['Chronic Low Self-Esteem (help child talk positively about self: "I\'m a good girl. I\'m smart.")','Ineffective Coping · Anxiety · <b>Powerlessness</b> (focus on strengths, not challenges) · Impaired Verbal Communication','<b>Risk for Violence: DTS/DTO</b> (directed at self/others) · Impaired Social Interaction',MK('<b>Danger to self/others — safety is the #1 goal.</b>'),'Know the desired outcome before planning interventions.'])]),
C('ch_interv','Interventions for Children — Therapies',{hy:1,kw:'play therapy bibliotherapy art music journaling family behavioral therapy'},[
 ul([MK('<b>Behavioral therapy:</b> reward age-appropriate behavior — <b>star/point chart</b> exchanged for privileges (e.g., 20 points = 30 min TV/tablet). Rewards must be age-appropriate and earned.'),MK('<b>Play therapy</b> = "the work of childhood": children develop physically, intellectually, emotionally, socially, morally through play; helps trauma stored in nonverbal brain regions (amygdala, thalamus, hippocampus, brainstem) move to verbal frontal lobes.'),'<b>Bibliotherapy:</b> identify with characters in stories; child must have ability; in supportive environment → insight and new coping.','<b>Art therapy:</b> drawing, painting, sculpting. <b>Journaling:</b> older children/adolescents (gratitude journal). <b>Music therapy:</b> evidence-based, non-threatening, multisensory.','<b>Family counseling</b> = key component: goals, homework, group education. Adolescent with MDD after suicide attempt: encourage active participation and self-set goals.'])]),
C('ch_behav','Disruptive Behavior Management',{hy:1,kw:'time-out special time quiet room seclusion restraint sleep hygiene bullying least restrictive'},[
 ul(['Principles: kindness, courtesy, respect; handle behaviors when they happen; team approach; flexible; realistic goals including client/family; focus on strengths; keep hope alive. Use <b>least restrictive alternatives</b>.',MK('<b>Time-out</b>: remove child to a chair against wall or room; <b>1 minute per year of age</b> (5-year-old = 5 minutes).'),'<b>Special time</b>: designated time (e.g., 30 min) just parent and child — <b>child chooses the activity</b>; parent doesn\'t direct.','<b>Quiet room</b>: blanket space at home/school to recompose. <b>Avoid seclusion and restraints</b> — last resort for very disruptive/unsafe children, as little as possible.','<b>Sleep hygiene</b>: inadequate sleep → worse behavior. <b>Bullying</b>: children with mental/developmental disabilities are more often targeted.','Parent training: positive reinforcement, structure, consistent discipline.'])]),
C('ch_eval','Evaluating Outcomes in Children',{kw:'evaluating outcomes anxiety strategies social skills resilience mentor'},[
 ul(['Were outcomes met? Interacting in <b>age-appropriate, socially acceptable</b> ways? Expresses positive self-affirmations? Can express anxiety/depression? Uses anxiety-reducing strategies? Harmed self/others? Recognizes and states choices? Establishing trusting relationship with nurse?','<b>Multimodal:</b> group + individual therapy; <b>social skills</b> (recognize impact on others); <b>problem-solving skills training</b> (generate alternatives; rewards/consequences); boys with ADHD → better peer relationships; <b>parent training</b> (set limits, positive attention/praise).',LX('Build resilience: every child needs a <b>mentor</b> (someone who believes in them), taught to find their own support; coping skills must be more than distraction.')])]),
C('ch_soc','Social & Emotional Development (Definitions)',{kw:'social development emotional development definition'},[
 ul([MK('<b>Social development</b> = learning to have <b>positive relationships</b> with other people; early social skills support school, work, family and community life.'),MK('<b>Emotional development</b> = closely related; children\'s <b>feelings about themselves, the people in their lives, and the environment</b> in which they live.')])])
);

var SRC_CHAPTERS = [{"id": "ed131", "title": "13.1 Introduction — Eating Disorders (OpenRN, verbatim)", "md": "- Learning Objectives\n- Identify assessment cues of eating disorder behaviors\n- Identify nursing priorities for clients with eating disorders\n- Plan outcomes for clients with eating disorders\nDifferentiate safety/protective interventions for clients with eating disorders\nApply evidence-based practice when planning care and interventions for clients with eating disorders\n- Analyze treatments for clients with eating disorders\nApply the nursing process to clients with eating disorders at risk for suicide\nMany individuals experience concerns about their weight at some point in their lives. However, eating disorders involve a distorted perception of weight and body image, leading to an unhealthy relationship with food. This psychological struggle can result in behaviors such as extreme food restriction, compulsive exercise, binge eating, and purging. Eating disorders can affect people of any gender, age, race, or socioeconomic background and often have a profound impact on their loved ones. Without proper identification and treatment, the physiological consequences can be life-threatening. This chapter explores the various types of eating disorders, common assessment findings, treatment approaches, and nursing interventions.13.11 Chapter 13 Glossary\nAmylophagia: Starch eating.\nAnorexia nervosa (AN): A condition where people avoid food, severely restrict food, or eat very small quantities of only certain foods.\nAvoidant restrictive food intake disorder (ARFID): A condition where individuals limit the amount or type of food eaten.\nBinge-eating disorder (BED): A condition where people lose control over their eating and have recurring episodes of eating unusually large amounts of food. Unlike bulimia nervosa, periods of binge eating are not followed by purging, excessive exercise, or fasting.\nBinge eating episode: An episode characterized by both eating in a discrete period of time (e.g., within any two-hour period) an amount of food that is definitely larger than what most individuals would eat and a sense of a lack of control overeating during the episode; followed by purging behaviors.\nBinge-eating/Purging type: Individuals experience episodes of binge eating and/or purging.\nBody mass index (BMI): A person’s weight in kilograms divided by the square of height in meters.\nBulimia nervosa (BN): A condition where people have recurrent and frequent episodes of eating unusually large amounts of food and feeling a lack of control over these episodes.\nEating disorders (EDs): Mental health conditions characterized by disturbances in eating behaviors and related thoughts and emotions.\nEmaciation: A condition of extreme thinness.\nFamily-based therapy: A type of psychotherapy in which parents take an active role in managing their child’s eating behaviors and weight restoration.\nGeophagia: Clay eating.\nLanugo: Growth of fine hair all over the body.\nPagophagia: Ice eating.\nPica: An eating disorder in which an individual repeatedly eats things that are not considered food with no nutritional value, such as paper, dirt, soap, hair, glue, or chalk.\nPurging: Behavior in eating disorders used to compensate for overeating, such as forced vomiting, excessive use of laxatives, or diuretics.\nRefeeding syndrome: A potentially fatal complication for any client with negligible food intake for more than five days that involves hypophosphatemia; serious sodium and fluid imbalances; changes in glucose, protein, and fat metabolism; thiamine deficiency; hypokalemia; and hypomagnesaemia.\nRestricting type: Individuals severely limit the amount and type of food they consume and may engage in excessive exercise.14.1 Introduction\n- Learning Objectives\n- Identify assessment cues of substance use behaviors\n- Identify nursing priorities for clients with substance use disorders\n- Plan outcomes for clients with substance use disorders\nDifferentiate safety/protective interventions for clients with substance use disorders\nApply evidence-based practice when planning care and interventions for clients with substance use disorders\n- Analyze treatments for clients with substance use disorders\nApply the nursing process to clients with substance use disorders at risk for suicide\nAssess clients for signs of intoxication, dependency, and withdrawal symptoms and intervene appropriately\nApply the nursing process to clients experiencing withdrawal or toxicity from substances\nDescribe care for clients with nonsubstance-related dependencies (e.g., gambling, sexual addiction)\nDescribe the neurobiology and risk factors for substance use disorders\nDescribe protective factors and prevention programs for substance use disorders\nMisuse of alcohol, drugs, and prescribed medications is estimated to cost the United States more than $400 billion in health care expenses, law enforcement and criminal justice costs (due to drug-related crimes), lost workplace productivity, and losses from motor vehicle crashes.[1] The Centers for Disease Control and Prevention (CDC) National Center for Health Statistics estimates 107,622 drug overdose deaths and 52,000 alcohol-induced deaths occurred in the United States in 2021.[2]\n- Take a Closer Look\nView a visualization of recent drug overdose death rates nationally and by state at the CDC National Center for Health Statistics’ Vital Statistics Rapid Release web page: Provisional Drug Overdose Death Counts(opens in new tab).\nSubstance use disorders significantly impact individuals, families, communities, and our society. According to the 2020 National Survey on Drug Use and Health (NSDUH), 40.3 million people in the United States aged 12 or older (14.5 percent) have a substance use disorder (SUD).[3]\nThis chapter will provide an overview of many topics related to substance use. It begins by reviewing signs of intoxication of various psychoactive substances and treatment for overdose and withdrawal symptoms. The neurobiology of substance use disorders and risk factors are explored, and then evidence-based treatment and prevention interventions are discussed based on the Surgeon General’s Report on Alcohol, Drugs, and Health PDF(opens in new tab). Finally, the nursing process is applied to a hospitalized client receiving treatment for alcohol withdrawal."}, {"id": "chnote", "title": "OpenRN Ch 13.2–13.11 and 14.1–14.9 — where to find this material", "md": "**Not stored verbatim:** the OpenRN chapter text for 13.2–13.4, 13.11 and 14.1–14.9 was not saved in a form this build could read back, so it is not reproduced here. Every fact from those chapters that the build extracted lives in the topic-tab cards (Eating Disorders and Substance Use), the Reference Tables and Quick View. If you want this tab to hold the chapters word-for-word, paste them again and the tab can be extended.\n\n- Eating Disorders tab: cards for 13.2–13.4 and the 13.11 glossary\n- Substance Use tab: cards for 14.1–14.9\n- Reference Tables tab: numeric thresholds and comparison tables"}, {"id": "subslides", "title": "Substance Use Disorder — Module 8 lecture slides (Dr. Tracy Koscielak, RN)", "md": "# Slide 1\n- SUBSTANCE USE\n- DISORDER\n- MODULE 8\n- Presented by: Dr. Tracy Koscielak, RN\n# Slide 2\n- INTRODUCTION\n- Statistics, prevalence, and cost to society %\n- 25\n- Dopamine Pathways\n- Substance abuse vs. substance dependency\n- DSM 5 Criteria\n- Dopamine pathway\n- Etiology of Substance Abuse -\n- GABA '\n- innibitow\n- Alcohol Withdrawal -\n- Glutamate\n- -\n- peaks within 72 his excite\n- ·\n# Slide 3\n- DSM-5 CRITERIA\n- Use of Substances Defined\n- Tolerance & Withdrawal\n- Signs and Symptoms\n- Primary Defense Mechanisms\n- -Denial\n- -Minimization\n# Slide 4\n- SUBSTANCE ABUSE ON DEMOGRAPHICS\n- Cultural Considerations\n- Demographic variables\n- Psychosocial, cultural, cognitive & spiritual effects\n# Slide 5\n- SUBSTANCE ABUSE EFFECTS OVER THE LIFE\n- function srsGet() { var d = lsGet('srs_data', {}); return d && typeof d === 'object' ? d : {}; }
function srsAnswer(id, wasCorrect) {
  var d = srsGet(), e = d[id] || { level: 0, nextReview: 0 };
  var lv = typeof e.level === 'number' ? e.level : 0;
  lv = wasCorrect ? Math.min(4, lv + 1) : Math.max(0, lv - 1);
  d[id] = { level: lv, nextReview: Date.now() + SRS_DAYS[lv] * 86400000 };
  lsSet('srs_data', d);
  updateSRSBadges(); updateDueCount();
}
function srsDueIds() {
  var d = srsGet(), now = Date.now();
  return Object.keys(d).filter(function (k) { return d[k].nextReview <= now; });
}
function updateDueCount() {
  var n = srsDueIds().length, el = $('due-count');
  if (el) el.textContent = '📅 ' + n + ' due';
}
function updateSRSBadges() {
  var d = srsGet(), now = Date.now();
  var els = document.querySelectorAll('[data-card-id]');
  for (var i = 0; i < els.length; i++) {
    var el = els[i], id = el.getAttribute('data-card-id'), host = el.querySelector('.badges');
    if (!host) continue;
    var b = host.querySelector('.badge.srs');
    var e = d[id];
    if (!e) { if (b) b.parentNode.removeChild(b); continue; }
    if (!b) { b = document.createElement('span'); b.className = 'badge srs'; host.insertBefore(b, host.firstChild); }
    if (e.nextReview <= now) { b.className = 'badge srs due'; b.textContent = '📅 Due'; }
    else if (e.nextReview - now < 86400000) { b.className = 'badge srs soon'; b.textContent = '⏰ Soon'; }
    else { b.className = 'badge srs'; b.textContent = '✓ OK'; }
  }
}
/* map a quiz question to matching topic cards so quiz answers move the same SRS store */
function srsTouchFromQuestion(q, ok) {
  try {
    var hay = ((q.stem || '') + ' ' + (q.topic_angle || '') + ' ' + ((q.rationale && q.rationale.correct) || '')).toLowerCase();
    var best = null, bs = 1;
    TOPIC_TABS.forEach(function (t) {
      CARDS[t.id].forEach(function (c) {
        var toks = (c.kw + ' ' + c.t).toLowerCase().split(/[^a-z0-9\-]+/).filter(function (w) { return w.length >= 5; });
        var seen = {}, sc = 0;
        toks.forEach(function (w) { if (!seen[w] && hay.indexOf(w) >= 0) { seen[w] = 1; sc++; } });
        if (sc > bs) { bs = sc; best = c.id; }
      });
    });
    if (best) srsAnswer(best, ok);
  } catch (e) {}
}

/* ---------- Last studied ---------- */
function relTime(ms) {
  var s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return 'just now';
  var m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
function updateLSBadge(el) {
  var host = el.querySelector('.badges'); if (!host) return;
  var lv = lsGet('last_viewed', {}), id = el.getAttribute('data-card-id');
  var b = host.querySelector('.badge.ls');
  if (!b) { b = document.createElement('span'); host.appendChild(b); }
  if (lv[id]) { b.className = 'badge ls'; b.textContent = '🕓 Studied ' + relTime(lv[id]); }
  else { b.className = 'badge ls never'; b.textContent = '🕓 Never reviewed'; }
}

var lsTimers = {}, lsObs = null;
function startLastStudiedObserver() {
  if (!('IntersectionObserver' in window)) return;
  if (lsObs) lsObs.disconnect();
  lsTimers = {};
  lsObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      var el = en.target, id = el.getAttribute('data-card-id');
      var vis = en.intersectionRatio >= 0.6 || en.intersectionRect.height >= window.innerHeight * 0.5;
      if (vis && !lsTimers[id]) {
        lsTimers[id] = setTimeout(function () {
          delete lsTimers[id];
          var lv = lsGet('last_viewed', {}); lv[id] = Date.now(); lsSet('last_viewed', lv);
          updateLSBadge(el);
        }, 1200);
      } else if (!vis && lsTimers[id]) { clearTimeout(lsTimers[id]); delete lsTimers[id]; }
    });
  }, { threshold: [0, 0.3, 0.6, 1] });
  var els = document.querySelectorAll('[data-card-id].card');
  for (var i = 0; i < els.length; i++) lsObs.observe(els[i]);
}

function srcInline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function srcToHTML(md) {
  var lines = md.split('\n'), out = '', mode = '', tbl = false, i, ln;
  function close() { if (mode === 'ul') out += '</ul>'; else if (mode === 'ol') out += '</ol>'; mode = ''; }
  function closeT() { if (tbl) { out += '</table></div>'; tbl = false; } }
  for (i = 0; i < lines.length; i++) {
    ln = lines[i];
    if (!ln.trim()) { close(); closeT(); continue; }
    if (ln.indexOf('[[') === 0) { close(); closeT(); out += '<div class="box">'; if (ln.length > 2) out += '<p><b>' + srcInline(ln.substring(2)) + '</b></p>'; continue; }
    if (ln === ']]') { close(); closeT(); out += '</div>'; continue; }
    if (ln.charAt(0) === '|') {
      close();
      var cells = ln.substring(1).split('|').map(function (x) { return x.trim(); });
      if (!tbl) { out += '<div class="tw"><table><tr>' + cells.map(function (x) { return '<th>' + srcInline(x) + '</th>'; }).join('') + '</tr>'; tbl = true; }
      else out += '<tr>' + cells.map(function (x) { return '<td>' + srcInline(x) + '</td>'; }).join('') + '</tr>';
      continue;
    }
    closeT();
    if (ln.indexOf('# ') === 0) { close(); out += '<h4>' + srcInline(ln.substring(2)) + '</h4>'; continue; }
    if (ln.indexOf('- ') === 0) { if (mode !== 'ul') { close(); out += '<ul>'; mode = 'ul'; } out += '<li>' + srcInline(ln.substring(2)) + '</li>'; continue; }
    var nm = /^\d+\.\s+(.*)$/.exec(ln);
    if (nm) { if (mode !== 'ol') { close(); out += '<ol>'; mode = 'ol'; } out += '<li>' + srcInline(nm[1]) + '</li>'; continue; }
    close(); out += '<p>' + srcInline(ln) + '</p>';
  }
  close(); closeT();
  return out;
}
